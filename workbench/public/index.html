async function connectDir(pid){
  if(SERVER){ toast('本地服务已接管读写，无需再连接目录', 'ok'); return; }
  if(zeroById(pid) && scanRoot){
    if(zeroPending[pid]){ toast('正在解析本机目录，稍候…'); return; }
    await ensureZeroHandle(pid);
    if(dirHandles[pid]){
      toast('已通过本机扫描根连接该目录 · ' + (scanPerm === 'write' ? '可读写' : '只读浏览（保存时会再要一次写权限）'), 'ok');
      renderSplit(); return;
    }
    toast('该目录解析失败，可能是权限已过期或目录被移动 · 请到控制室点「续期授权」或「重新扫描」', 'warn');
    return;
  }
  const fileProto = typeof location !== 'undefined' && location.protocol === 'file:';
  if(!window.showDirectoryPicker){
    toast('当前浏览器不支持目录访问（需 Chrome / Edge 86+）', 'warn');
    return;
  }
  try {
    /* 同样默认只读：与控制室保持一致的权限口径，否则会出现
       「控制室说只读、repo 窗格说可读写」的自相矛盾。 */
    const handle = await window.showDirectoryPicker({ mode:'read', id:'wt-' + pid });
    dirHandles[pid] = handle;
    const lv = await permLevel(handle);
    dirPerm[pid] = lv;
    toast('已连接目录 ' + handle.name + ' · ' + (lv === 'write' ? '可读写' : '只读浏览（保存时会再要一次写权限）'), 'ok');
    renderSplit();
  } catch(e){
    if(e && e.name === 'AbortError'){ toast('已取消选择目录'); return; }
    const why = fileProto
      ? 'file:// 不是安全上下文，浏览器直接拦掉了目录选择器 —— 这不是本页的 bug。'
      : '浏览器拒绝了目录选择器：' + (e && e.message ? e.message : e);
    toast(why + ' 解决办法：用 https 地址（GitHub Pages）或双击「启动工作台.bat」后用 http://127.0.0.1 打开。', 'warn');
  }
}

/* 读时只读、存时才要写：这是整个权限模型的收口。
   选目录时只要读权限（否则 C:\ 这类位置会「选完才报错」），
   等用户真的点保存、手势窗口还开着的这一刻，再去争取写权限。 */
async function liveSave(pid, rel, btn){
  const handle = dirHandles[pid];
  const ta = document.querySelector('[data-live-text]');
  if(!handle || !ta){ toast('目录未连接', 'warn'); return; }
  /* 写权限升级必须落在第一个 await 之前。
     requestPermission 依赖 transient user activation，放到任何 await 之后都会静默失效。
     这里是 click → liveSave 的第一段，所以手势还在。 */
  let lv = 'read';
  try { lv = await handle.queryPermission({ mode:'readwrite' }); } catch(e){ lv = 'denied'; }
  if(lv !== 'granted'){
    if(btn){ btn.disabled = true; btn.textContent = '请求写权限…'; }
    lv = await permUpgrade(handle);
    if(btn){ btn.disabled = false; btn.textContent = '保存'; }
  }
  if(lv !== 'granted'){
    toast('未能取得写权限：该目录被浏览器或系统保护（常见于 C:\\ 盘根、系统目录）。' +
          '读取不受影响；要写盘请到控制室另选一个可写目录。', 'warn');
    return;   // 注意：这里绝不清 dirHandles[pid]，否则连浏览也断了
  }
  try {
    let cur = handle;
    const segs = rel.split('/');
    const name = segs.pop();
    for(const seg of segs) cur = await cur.getDirectoryHandle(seg);
    const fh = await cur.getFileHandle(name, { create:true });
    const w = await fh.createWritable();
    await w.write(ta.value);
    await w.close();
    dirPerm[pid] = 'write';   // 争取到写权限后记住，下次保存不用再弹一次
    toast('已写入磁盘：' + rel, 'ok');
    if(btn) btn.textContent = '已保存';
  } catch(e){ toast('写入失败：' + (e && e.message ? e.message : e), 'warn'); }
}

/* ============================================================
   零服务模式：本机目录授权 → 单页扫描 → 直接读写
   把 serve.mjs + 启动工作台.bat 的扫描能力搬进单页：
   目录句柄存 IndexedDB，刷新后点一次续期即可；无需 Node、无需安装。
   ============================================================ */
const IDB_NAME = 'wt-fs', IDB_STORE = 'handles';

/* IndexedDB 在 file:// 等环境下偶发「既不成功也不报错」，会永远吊住 await。
   因此每个操作都必须带超时：宁可放弃持久化，也绝不能让扫描这条主链路被卡住。 */
const IDB_TIMEOUT_MS = 1500;
function idbOpen(){
  return new Promise((res, rej) => {
    if(typeof indexedDB === 'undefined'){ rej(new Error('浏览器不支持 IndexedDB')); return; }
    let done = false, timer = null;
    const finish = (fn, arg) => { if(done) return; done = true; if(timer) clearTimeout(timer); fn(arg); };
    timer = setTimeout(() => finish(rej, new Error('IndexedDB 无响应（已跳过持久化）')), IDB_TIMEOUT_MS);
    let rq;
    try { rq = indexedDB.open(IDB_NAME, 1); } catch(e){ finish(rej, e); return; }
    rq.onupgradeneeded = () => { const db = rq.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    rq.onsuccess = () => finish(res, rq.result);
    rq.onerror = () => finish(rej, rq.error || new Error('IndexedDB 打开失败'));
    rq.onblocked = () => finish(rej, new Error('IndexedDB 被其它标签页占用'));
  });
}
function idbTx(mode, fn){
  return idbOpen().then(db => new Promise((res, rej) => {
    let done = false, timer = null;
    const finish = (fn2, arg) => { if(done) return; done = true; if(timer) clearTimeout(timer); fn2(arg); };
    timer = setTimeout(() => finish(rej, new Error('IndexedDB 事务无响应')), IDB_TIMEOUT_MS);
    let tx, rq;
    try { tx = db.transaction(IDB_STORE, mode); rq = fn(tx.objectStore(IDB_STORE)); }
    catch(e){ finish(rej, e); return; }
    tx.oncomplete = () => finish(res, rq && rq.result);
    tx.onerror = () => finish(rej, tx.error || new Error('IndexedDB 事务失败'));
    tx.onabort = () => finish(rej, tx.error || new Error('IndexedDB 事务中止'));
  }));
}
const idbPut = (k, v) => idbTx('readwrite', os => os.put(v, k));
const idbGet = (k) => idbTx('readonly', os => os.get(k));
const idbDel = (k) => idbTx('readwrite', os => os.delete(k));

/* 权限等级：把「读」与「写」拆成两个维度，避免为了读个目录也要写权限。
   关键的 Chrome 语义：read 已 granted 时，queryPermission({mode:'readwrite'}) 返回的是 'prompt'
   而不是 'granted'；只有真正拿过 write 授权才返回 'granted'。
   所以不能用一个 readwrite 查询代表全部，否则只读目录会被误判成「没权限」，
   进而在没有用户手势的启动路径上反复 requestPermission —— 那是必然失败且会让扫描彻底不可用。 */
async function permLevel(handle){
  if(!handle) return 'none';
  if(typeof handle.queryPermission !== 'function') return 'write';
  let rd;
  try { rd = await handle.queryPermission({ mode:'read' }); }
  catch(e){ return 'denied'; }
  if(rd === 'denied') return 'denied';
  if(rd !== 'granted') return 'prompt';
  let wr;
  try { wr = await handle.queryPermission({ mode:'readwrite' }); }
  catch(e){ wr = 'denied'; }
  return wr === 'granted' ? 'write' : 'read';
}
/* 争取写权限。铁律：requestPermission 依赖 transient user activation，
   必须放在 click 处理链的「第一个 await 之前」，放到任何 await 之后都会静默失效。 */
async function permUpgrade(handle){
  if(!handle) return 'none';
  if(typeof handle.requestPermission !== 'function') return 'granted';
  try { return await handle.requestPermission({ mode:'readwrite' }); }
  catch(e){ return 'denied'; }
}
/* 续期只需读权限：写权限等用户真的点保存时再要，避免一次续期把整个位置卡死 */
async function permResume(handle){
  if(!handle) return 'none';
  if(typeof handle.requestPermission !== 'function') return 'granted';
  try { return await handle.requestPermission({ mode:'read' }); }
  catch(e){ return 'denied'; }
}

const EXACT_MEASURE = 400;
/* 两档预算。用户扫不到深层项目时，正确做法不是单纯加深，而是同时给更大的目录预算：
   只加深会让扫描更慢，但浅层照样先把预算吃光，深层还是轮不到。 */
function WALK(){
  return deepScan
    ? { depth:8, visited:20000, findMs:40000, layer:[2500, 1200, 700, 450, 300, 200, 150, 100] }
    : { depth:4, visited:2500, findMs:5000,  layer:[400, 200] };
}
let lastScan = { visited:0, depth:0, errors:0, truncated:false };   // 最近一次扫描的遍历统计，用于「0 结果」时给出可诊断的提示
let scanStateMsg = '';   // 扫描进度文案；扫描期间实时刷新，避免界面看起来像「点了没反应」

/* 扫描是异步且可能耗时的（选到 C:\ 这类超大根时尤甚），必须给出实时进度。
   只更新进度行本身，不整块重绘 dirBar，避免扫描期间反复重建按钮。 */
/* 扫描进度提示：opts.spinner 给一个转圈，opts.progress(0-100) 给一条进度条。
   失败 / 取消等终态不加 spinner，避免「转圈却已停」的误导。 */
function setScanState(msg, opts){
  opts = opts || {};
  scanStateMsg = msg || '';
  const el = document.getElementById('dirStateRow');
  if(!el) return;
  el.style.display = scanStateMsg ? '' : 'none';
  if(!scanStateMsg) return;
  const inner = opts.spinner
    ? '<span class="dir-scanning"><span class="spin"></span>' + (opts.err ? '<span class="dir-v err" style="color:inherit">' : '') + esc(scanStateMsg) + (opts.err ? '</span>' : '') + '</span>'
    : (opts.err ? '<span class="dir-v err">' + esc(scanStateMsg) + '</span>' : esc(scanStateMsg));
  const bar = (opts.spinner && typeof opts.progress === 'number')
    ? '<div class="scan-bar"><i style="width:' + Math.max(2, Math.min(100, opts.progress)) + '%"></i></div>'
    : '';
  el.innerHTML = '<span class="dir-k">进度</span><span class="dir-v">' + inner + bar + '</span>';
}

/* 每次 next() 单独计时：网络驱动器、脱机盘、U 盘拔出、被杀软拦下的目录
   都会让 entries() 无限期挂起，而预算检查点在「出队时」，await 阻塞期间根本执行不到。
   注意必须返回「异步可迭代对象」而不是 Promise —— Promise 不是 async-iterable，
   直接 for await 一个 Promise 会抛 TypeError，结果每次列目录都拿到空数组。 */
const IO_TIMEOUT_MS = 3000;
function withTimeoutIter(iter, ms){
  const it = iter && iter[Symbol.asyncIterator] ? iter[Symbol.asyncIterator]() : null;
  const src = it || (iter && iter[Symbol.iterator] ? iter[Symbol.iterator]() : null);
  if(!src) throw new Error('不可迭代');
  return (async function*(){
    for(;;){
      let timer = null;
      /* 每次 next() 都重新计时，所以是「卡住 N 毫秒就放弃」，而不是「整次枚举有总时限」 */
      const guard = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('IO 超时')), ms); });
      try {
        const r = it ? await Promise.race([it.next(), guard]) : await Promise.race([Promise.resolve(src.next()), guard]);
        if(r.done) return;
        yield r.value;
      } finally {
        if(timer) clearTimeout(timer);   // 不清理的话，每列一个目录就留一个待触发的定时器
      }
    }
  })();
}
/* 兼容不同实现：优先 entries()，退化到 values()；两者都不可用时记一次错误 */
async function listDir(dir){
  const out = [];
  try {
    if(typeof dir.entries === 'function'){
      for await (const e of withTimeoutIter(dir.entries(), IO_TIMEOUT_MS)) out.push([e[0], e[1]]);
      return out;
    }
    for await (const h of withTimeoutIter(dir.values(), IO_TIMEOUT_MS)) out.push([h.name, h]);
  } catch(e){ lastScan.errors++; }
  return out;
}

async function readSmallText(dir, name, cap){
  try {
    const fh = await dir.getFileHandle(name);
    const f = await fh.getFile();
    if(f.size > cap) return null;
    return await f.text();
  } catch(e){ return null; }
}
function portsFromText(txt){
  const out = new Set();
  if(!txt) return [];
  const re = /(?:--port[=\s]+|-p\s+|PORT\s*=\s*|localhost:|127\.0\.0\.1:)(\d{2,5})/g;
  let m;
  while((m = re.exec(txt))){ const n = +m[1]; if(n >= 80 && n <= 65535) out.add(n); }
  return [...out].slice(0, 6);
}

/* 递归找项目根：命中 .git 或任一工程标记文件即认定为项目。
   被选中的目录本身若是项目，也计入（rel 为空串）——否则「直接选中单个项目文件夹」会一无所获。
   遍历用广度优先：选到 C:\ 这类超大根时，预算优先花在浅层，先把整个盘面扫一遍再往深处走；
   若用深度优先，预算会被 Users\<你>\AppData 这类巨型单支一次耗尽，深层项目永远轮不到。
   全程带硬预算（目录数 + 耗时），超限即停并置 truncated，保证几秒内一定返回结果。 */
async function findProjectRoots(root, onProgress){
  const hits = [];
  const W = WALK();
  lastScan = { visited:0, depth:0, errors:0, truncated:false };
  const t0 = Date.now();
  const overBudget = () => lastScan.visited >= W.visited || (Date.now() - t0) > W.findMs;
  const queue = [{ dir: root, rel: '', depth: 0 }];
  let qi = 0;
  while(qi < queue.length){
    if(scanAbort) break;
    if(hits.length >= MAX_PROJECTS){ lastScan.truncated = true; break; }
    if(overBudget()){ lastScan.truncated = true; break; }
    const { dir, rel, depth } = queue[qi++];
    lastScan.visited++;
    if(depth > lastScan.depth) lastScan.depth = depth;
    if(onProgress && lastScan.visited % 100 === 0) onProgress(lastScan);
    const entries = await listDir(dir);
    const files = entries.filter(e => e[1] && e[1].kind === 'file');
    const dirs  = entries.filter(e => e[1] && e[1].kind === 'directory');
    const langs = new Set();
    for(const [n] of files){
      if(MARK_FILES[n]) langs.add(MARK_FILES[n]);
      const i = n.lastIndexOf('.');
      if(i > 0 && SUFFIX_MARKS[n.slice(i).toLowerCase()]) langs.add(SUFFIX_MARKS[n.slice(i).toLowerCase()]);
    }
    const git = dirs.some(([n]) => n === '.git');
    if(git || langs.size) hits.push({ rel, dir, git, langs:[...langs] });
    if(depth >= W.depth) continue;
    /* 分层配额：浅层目录动辄成千上万，不设配额的话预算在第 1-2 层就被吃光，
       深层的项目根本轮不到。超配额的分支直接跳过，并把 truncated 置上，
       这样「0 结果」时提示会说清是跳过了、而不是扫过了。 */
    const layerCap = W.layer[depth] !== undefined ? W.layer[depth] : Infinity;
    let pushed = 0;
    for(const [n, h] of dirs){
      if(SKIP_DIRS.has(n) || n.startsWith('.')) continue;
      if(pushed >= layerCap) continue;
      pushed++;
      queue.push({ dir: h, rel: rel ? rel + '/' + n : n, depth: depth + 1 });
    }
  }
  return hits;
}

/* 量一个项目：字节数 / 文件数 / 语言分布 / README 首段 / 声明端口。
   全部有上限（文件数 + 深度 + 截止时间），保证单个超大目录也不会把整次扫描拖住。
   体积用「采样 + 外推」：逐文件 getFile() 在大项目上是 2500 次异步 IO，
   150 个项目下来会把整次扫描拖到预算之外，结果卡片上体积全是 0。
   改为精确测前 EXACT_MEASURE 个文件，之后只计数并按均值外推，返回的 estimated 会让 UI 加 ~ 前缀。
   语言分布与文件数始终是全量统计，不受采样影响。 */
async function measureDir(dir, deadline){
  let size = 0, files = 0, truncated = false, mtime = 0, measured = 0, estimated = false;
  const langs = new Map(), samples = [];
  async function walk(d, rel, depth){
    if(truncated || depth > WALK().depth) return;
    if(scanAbort){ truncated = true; return; }
    if(deadline && Date.now() > deadline){ truncated = true; return; }
    const entries = await listDir(d);
    entries.sort((a, b) => a[1].kind === b[1].kind ? a[0].localeCompare(b[0], 'zh') : (a[1].kind === 'directory' ? -1 : 1));
    for(const [n, h] of entries){
      if(files >= MAX_MEASURE){ truncated = true; return; }
      if(h.kind === 'directory'){
        if(SKIP_DIRS.has(n) || n.startsWith('.')) continue;
        await walk(h, rel ? rel + '/' + n : n, depth + 1);
        continue;
      }
      files++;
      const i = n.lastIndexOf('.');
      const lang = i > 0 ? EXT_LANG[n.slice(i).toLowerCase()] : '';
      if(lang) langs.set(lang, (langs.get(lang) || 0) + 1);
      if(measured >= EXACT_MEASURE){ estimated = true; continue; }
      try {
        const f = await h.getFile();
        size += f.size; measured++;
        if(f.lastModified > mtime) mtime = f.lastModified;
        if(depth === 0 && samples.length < MAX_SAMPLES && f.size < 262144) samples.push({ p:rel ? rel + '/' + n : n, t:await f.text() });
      } catch(e){}
    }
  }
  await walk(dir, '', 0);
  if(estimated && measured > 0 && files > measured) size = Math.round(size / measured * files);
  const pkg = await readSmallText(dir, 'package.json', 131072);
  const readme = samples.find(s => /^readme(\.(md|markdown|txt|rst))?$/i.test(s.p));
  const readmeTxt = readme ? readme.t : null;
  return {
    size, files, truncated, estimated, langs, samples,
    readme: readmeTxt ? readmeTxt.slice(0, 400) : '',
    ports: portsFromText(pkg || readmeTxt || ''),
    mtime
  };
}
/* 未测量（超出总预算）的项目用这份占位：语言仍由标记文件推导，体积/预览留空 */
function emptyMeasure(){ return { size:0, files:0, truncated:true, estimated:false, langs:new Map(), samples:[], readme:'', ports:[], mtime:0 }; }

function pickLangs(markerLangs, langMap){
  const top = [...langMap.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]);
  const out = [];
  for(const l of markerLangs.concat(top)) if(out.indexOf(l) < 0) out.push(l);
  return out.slice(0, 3);
}
function joinRootPath(rel){
  const base = String(zeroScan.rootPath || '').replace(/[\\/]+$/, '');
  const sep = /\\/.test(base) || /^[A-Za-z]:/.test(base) ? '\\' : '/';
  const label = scanRootName || zeroScan.rootName || '本机目录';
  if(!rel) return base || label;
  const tail = rel.split('/').join(sep);
  return base ? base + sep + tail : label + '/' + rel;
}

/* ---- 授权 / 续期 / 扫描 ---- */
/* 默认只要「读」权限：扫描与浏览全都是只读操作，写权限留到用户真的点「保存」那一刻再去要。
   这样选 C:\ 这类系统不允许写入的位置时，不会再出现「目录都选完了才报错」——
   Chrome 的 showDirectoryPicker({mode:'readwrite'}) 会在返回句柄前先隐式申请写权限，
   被 blocked-path 拦下时才抛 SecurityError，用户看到的就是选完之后才炸。
   绝不在失败后再调第二次 showDirectoryPicker：第一次调用已经消耗掉用户手势，
   重试必然失败，还会让用户再弹一次选择器。 */
async function pickScanRoot(){
  if(!CAN_FS){ toast('当前浏览器不支持原生目录访问，请改用「兼容模式扫描」（不需要该 API）', 'warn'); return; }
  let h = null;
  try {
    h = await window.showDirectoryPicker({ mode:'read', id:'wt-root' });
  } catch(e){
    if(e && e.name === 'AbortError'){ toast('已取消选择目录'); return; }
    /* 只报第一次的真实原因，不做链式重试（次生的「缺用户手势」会盖掉真实原因） */
    pickFail = { name:'', msg:(e && e.message ? e.message : String(e)) };
    renderDirBar();
    toast('选择目录失败：' + pickFail.msg + ' · 可点「兼容模式扫描」继续（不需要任何权限）', 'warn');
    return;
  }
  try {
    pickFail = null;
    scanRoot = h; scanRootName = h.name;
    scanPerm = await permLevel(h);
    flatFiles = null; flatTree = null; flatRootName = '';   // 切回句柄模式，兼容模式的旧清单作废
    pendingAuth = [];
    renderDirBar(); syncModeBadge();
    toast('已授权目录 ' + h.name + ' · ' +
      (scanPerm === 'write' ? '可读写' : '只读浏览（保存时会再向你要一次写权限）') + ' · 开始扫描', 'ok');
    /* 句柄持久化放后台尽力而为：IndexedDB 无响应时也只影响「刷新后续用」，绝不挡本次扫描 */
    idbPut(SCAN_ROOT_KEY, h).catch(() => toast('句柄未能写入浏览器存储 · 刷新后需重新授权', 'warn'));
    await scanRootNow();
  } catch(e){
    toast('扫描失败：' + (e && e.message ? e.message : e), 'warn');
    setScanState('扫描失败：' + (e && e.message ? e.message : String(e)));
  }
}
/* 续期只要读权限：扫描与浏览都是只读操作，写权限等用户真的点「保存」时再要。
   本函数只由「续期授权」按钮点击进入，requestPermission 处在手势窗口内。 */
async function resumeScanRoot(){
  const item = pendingAuth.find(x => x.key === SCAN_ROOT_KEY) || (scanRoot ? { handle:scanRoot } : null);
  if(!item){ toast('没有待续期的目录授权', 'warn'); return; }
  const r = await permResume(item.handle);
  if(r !== 'granted'){
    toast('未获授权，目录仍不可读 · 可点「兼容模式扫描」（不需要任何权限）', 'warn');
    renderDirBar();
    return;
  }
  scanRoot = item.handle; scanRootName = item.handle.name;
  scanPerm = await permLevel(item.handle);
  pendingAuth = pendingAuth.filter(x => x.key !== SCAN_ROOT_KEY);
  renderDirBar(); syncModeBadge();
  toast('已续期目录授权 · ' + (scanPerm === 'write' ? '可读写' : '只读浏览'), 'ok');
  await scanRootNow();
}
async function clearScanRoot(){
  scanRoot = null; scanRootName = ''; pendingAuth = []; localPorts = null;
  scanPerm = '';                       // 易漏：不重置的话清除后 UI 仍显示旧权限
  flatFiles = null; flatTree = null; flatRootName = ''; pickFail = null;
  zeroScan = { scannedAt:'', rootName:'', rootPath:zeroScan.rootPath || '', mode:'', projects:[] };
  Object.keys(dirHandles).forEach(k => { delete dirHandles[k]; });
  Object.keys(dirPerm).forEach(k => { delete dirPerm[k]; });
  store.write(LS.zero, zeroScan);
  try { await idbDel(SCAN_ROOT_KEY); } catch(e){}
  buildIndex(); renderAll(); syncModeBadge();
  toast('已清除本机目录授权与扫描结果', 'warn');
}
async function scanRootNow(){
  if(!scanRoot){ toast('先在控制室选择一个本机目录', 'warn'); return; }
  if(scanning){ toast('已有扫描在跑，再点扫描按钮可取消', 'warn'); return; }
  /* 只查询权限、绝不请求。
     requestPermission 依赖用户手势，而本函数会被页面加载时的恢复路径调用（那时没有手势），
     一请求就必然失败；旧实现失败后还不 return，继续拿没权限的句柄硬扫，
     结果所有 entries() 都失败，报出一个误导性的「没找到项目」——这就是刷新后扫描不可用的根因。 */
  scanPerm = await permLevel(scanRoot);
  renderDirBar();
  const btn = document.getElementById('dirScanBtn');
  const unbusy = () => {
    scanning = false;
    if(btn){ btn.disabled = false; btn.textContent = deepScan ? '深度扫描' : '重新扫描'; }
  };
  if(scanPerm === 'denied'){
    setScanState('目录不可读：权限已被拒绝或被系统阻止（常见于 C:\\ 盘根）· 请改选更靠近项目的父目录，或点「兼容模式扫描」');
    unbusy();
    return;
  }
  if(scanPerm === 'prompt'){
    setScanState('浏览器已收回授权（刷新后的常态）· 请点「续期授权」后再扫描');
    unbusy();
    return;
  }
  scanning = true;
  if(btn){ btn.textContent = '扫描中…点击取消'; btn.disabled = true; }
  setScanState('正在扫描…（随时可点「更换目录」或「兼容模式扫描」换目标）', { spinner:true });
  scanAbort = false;
  const t0 = Date.now();
  let roots = [];
  try {
    const W = WALK();
    roots = await findProjectRoots(scanRoot, p => {
      const pct = W.visited ? Math.min(100, Math.round(p.visited / W.visited * 100)) : null;
      setScanState('正在扫描… 已遍历 ' + p.visited + ' 个目录，最深 ' + p.depth + ' 层', { spinner:true, progress: pct });
    });
    const projects = [];
    const measureDeadline = t0 + W.findMs + MEASURE_BUDGET_MS;
    let measureStopped = false;
    for(const r of roots){
      if(scanAbort) break;
      let m;
      if(measureStopped || Date.now() > measureDeadline){ measureStopped = true; m = emptyMeasure(); }
      else {
        m = await measureDir(r.dir, measureDeadline);
        setScanState('正在统计 ' + (projects.length + 1) + '/' + roots.length + ' 个项目…', { spinner:true });
      }
      projects.push({
        rel: r.rel,
        name: r.rel ? r.rel.split('/').pop() : (scanRootName || '本机目录'),
        path: joinRootPath(r.rel),
        langs: pickLangs(r.langs, m.langs),
        category: r.git ? '本机扫描 · git' : '本机扫描',
        /* truncated 只表示「扫描被预算截断」，不能把 estimated（体积为采样外推值）算进来：
           外推是正常结果，形状完整、只是体积取近似，把它当成截断会让每个中等项目
           都背上一个「数据不完整」的标记。兼容模式那边只写 mtrunc，两边口径要一致。 */
        sizeBytes: m.size, files: m.files, truncated: m.truncated, estimated: !!m.estimated,
        updated: new Date(m.mtime || Date.now()).toISOString().slice(0, 10),
        git: r.git, samples: m.samples, readme: m.readme, ports: m.ports, live: null
      });
    }
    /* 用户主动取消：保留已扫到的部分，如实说明是半途停的，不假装扫完 */
    if(scanAbort){
      projects.sort((a, b) => b.sizeBytes - a.sizeBytes);
      zeroScan = {
        scannedAt: new Date().toISOString(), rootName: scanRootName,
        rootPath: zeroScan.rootPath || '', mode:'handle', projects,
        stats: { visited: lastScan.visited, depth: lastScan.depth, errors: lastScan.errors, truncated:true, measured: projects.filter(p => !p.truncated).length }
      };
      store.write(LS.zero, zeroScan);
      if(localPorts) applyPorts();
      setScanState('');
      buildIndex(); renderAll();
      toast('已取消扫描 · 保留已发现的 ' + projects.length + ' 个项目（结果不完整）', 'warn');
      return;   // finally 负责 unbusy，绝不卡在「已有扫描在跑」
    }
    projects.sort((a, b) => b.sizeBytes - a.sizeBytes);
    const truncated = lastScan.truncated || measureStopped;
    zeroScan = {
      scannedAt: new Date().toISOString(), rootName: scanRootName,
      rootPath: zeroScan.rootPath || '', mode:'handle', projects,
      stats: { visited: lastScan.visited, depth: lastScan.depth, errors: lastScan.errors, truncated, measured: projects.filter(p => !p.truncated).length }
    };
    store.write(LS.zero, zeroScan);
    if(localPorts) applyPorts();
    setScanState('');
    buildIndex(); renderAll();
    if(!projects.length){
      /* 权限提示放在第一位：旧版把它排在遍历统计之后，用户根本看不到重点 */
      toast((scanPerm === 'read' ? '当前只有只读权限（不影响扫描）。' : '') +
        '扫描完成：该目录下没找到项目（已遍历 ' + lastScan.visited + ' 个目录，最深 ' + lastScan.depth + ' 层' +
        (lastScan.errors ? '，有 ' + lastScan.errors + ' 个目录读取失败' : '') + '）。' +
        (lastScan.truncated ? '目录太大，扫描已达上限，可能没走到项目所在位置——请改选更靠近项目的父目录，或开「深度扫描」。' : '') +
        '项目需含 .git 或工程标记文件（package.json / CMakeLists.txt / Cargo.toml / go.mod 等）；' +
        '若项目在更深层，请改选更靠近项目的父目录。', 'warn');
    } else if(truncated){
      toast('扫描完成 · 发现 ' + projects.length + ' 个项目 · 用时 ' + ((Date.now() - t0) / 1000).toFixed(1) + 's' +
        '（已达扫描上限，结果可能不完整；选中的目录越大越容易漏，建议改选更靠近项目的父目录，或开「深度扫描」）', 'warn');
    } else {
      toast('扫描完成 · 发现 ' + projects.length + ' 个项目 · 用时 ' + ((Date.now() - t0) / 1000).toFixed(1) + 's', 'ok');
    }
  } catch(e){
    const msg = e && e.message ? e.message : String(e);
    toast('扫描失败：' + msg, 'warn');
    /* 关键：失败后仍保留已选目录，并明确引导重新选择，绝不卡在「已有扫描在跑」 */
    setScanState('扫描失败：' + msg + ' · 可点「更换目录」重新选，或点「兼容模式扫描」继续（不需要任何权限）', { err:true });
  } finally {
    unbusy();
  }
}
async function restoreScanRoot(){
  /* 兼容模式的结果不依赖句柄：刷新后项目列表仍在，只是「只读浏览」要重扫一次才有文件清单 */
  if(zeroScan.mode === 'flat'){
    scanRootName = zeroScan.rootName || '';
    renderDirBar();
    return;
  }
  let h = null;
  try { h = await idbGet(SCAN_ROOT_KEY); } catch(e){ h = null; }
  if(!h){ renderDirBar(); return; }
  scanRootName = h.name;
  /* 只读也算可用：旧版只认 readwrite，于是刷新后（浏览器把权限降级）扫描直接不可用。
     这里也绝不能 requestPermission —— 页面加载时没有用户手势，一请求就必失败。 */
  const lv = await permLevel(h);
  if(lv === 'read' || lv === 'write'){
    scanRoot = h; scanPerm = lv;
    renderDirBar(); syncModeBadge();
    if(!(zeroScan.projects || []).length) scanRootNow();
    return;
  }
  scanRoot = null; scanPerm = lv;
  pendingAuth = [{ key:SCAN_ROOT_KEY, handle:h }];
  renderDirBar();
}

/* ============================================================
   兼容模式扫描（兜底通道）：不依赖 showDirectoryPicker
   ------------------------------------------------------------
   <input webkitdirectory> 会把选中目录的完整文件清单交给页面，每个 File 自带
   webkitRelativePath（形如 "root/sub/a.txt"）。据此在内存里重建一棵虚拟目录树，
   再用与句柄模式完全相同的「命中 .git 或任一工程标记文件即认定为项目」规则识别项目。
   好处：不需要任何权限、不需要安全上下文，file:// 下也能用，C:\ 这类系统拒绝写入的位置也能扫。
   代价：拿不到目录句柄，所以只能只读浏览、不能写盘，且刷新后需要重新扫一次。 */
const MAX_FLAT_FILES = 60000;   // 文件清单处理上限：选到 C:\ 这类根会枚举出百万级文件，必须截断，否则内存与耗时都失控

function pickFlatRoot(){
  const inp = document.getElementById('dirFlatInput');
  if(!inp){ toast('当前环境不支持兼容模式扫描', 'warn'); return; }
  inp.value = '';   // 清空后再次选同一个目录也能触发 change
  inp.click();
}
function onFlatPicked(e){
  const files = e && e.target && e.target.files;
  if(!files || !files.length){ toast('没读到文件清单（目录为空或已取消选择）', 'warn'); return; }
  const btn = document.getElementById('dirScanBtn');
  if(btn){ btn.disabled = true; btn.textContent = '扫描中…'; }
  const done = () => { if(btn){ btn.disabled = false; btn.textContent = '重新扫描（兼容模式）'; } };
  scanFlatList(files).then(done, err => {
    const msg = err && err.message ? err.message : String(err);
    setScanState('兼容模式扫描失败：' + msg + ' · 可重新点「兼容模式扫描」再选一次', { err:true });
    toast('兼容模式扫描失败：' + msg, 'warn');
    done();
  });
}
async function scanFlatList(files){
  const t0 = Date.now();
  /* tree 提到模块级由 flatListAt 复用：旧版扫完就丢，导致每次列目录都要全量遍历几万条清单 */
  const tree = new Map();   // rel -> { dirs:Set<string>, files:[{name,size,mtime,file}] }
  const node = rel => { let n = tree.get(rel); if(!n){ n = { dirs:new Set(), files:[] }; tree.set(rel, n); } return n; };
  node('');
  const list = new Map();   // 相对路径 -> File，供仓库窗格只读浏览
  let rootName = '', truncatedList = false, i = 0;
  for(const f of files){
    if(i >= MAX_FLAT_FILES){ truncatedList = true; break; }
    const segs = String(f.webkitRelativePath || f.name).split('/');
    if(!rootName) rootName = segs[0];
    const rest = segs.slice(1);
    if(!rest.length) continue;
    const fname = rest.pop();
    let cur = '';
    for(const seg of rest){ node(cur).dirs.add(seg); cur = cur ? cur + '/' + seg : seg; }
    node(cur).files.push({ name:fname, size:f.size, mtime:f.lastModified, file:f });
    list.set(cur ? cur + '/' + fname : fname, f);
    i++;
    /* 分片让出主线程：几万个文件一次性整理会冻结界面数秒，用户会以为页面死了。
       阈值取 4000：设太小会被后台标签页的 setTimeout 节流（最低 1s）拖慢整次扫描。 */
    if(i % 4000 === 0){
      setScanState('正在整理文件清单… ' + i + ' / ' + files.length + ' 个文件', { spinner:true, progress: files.length ? Math.round(i / files.length * 100) : null });
      await new Promise(r => setTimeout(r, 0));
    }
  }
  if(!rootName){ toast('文件清单为空，无法识别目录名', 'warn'); return; }
  setScanState('正在扫描… 已整理 ' + i + ' 个文件', { spinner:true });

  /* 广度优先识别项目根，规则与硬预算与句柄模式完全一致 */
  const W = WALK();
  const hits = [];
  const stats = { visited:0, depth:0, errors:0, truncated:truncatedList };
  const queue = [{ rel:'', depth:0 }];
  let qi = 0;
  while(qi < queue.length){
    if(hits.length >= MAX_PROJECTS){ stats.truncated = true; break; }
    if(stats.visited >= W.visited || Date.now() - t0 > W.findMs){ stats.truncated = true; break; }
    const { rel, depth } = queue[qi++];
    stats.visited++;
    if(depth > stats.depth) stats.depth = depth;
    if(stats.visited % 200 === 0) setScanState('正在扫描… 已遍历 ' + stats.visited + ' 个目录，最深 ' + stats.depth + ' 层', { spinner:true, progress: W.visited ? Math.min(100, Math.round(stats.visited / W.visited * 100)) : null });
    const n = tree.get(rel);
    if(!n) continue;
    const langs = new Set();
    for(const f of n.files){
      if(MARK_FILES[f.name]) langs.add(MARK_FILES[f.name]);
      const i2 = f.name.lastIndexOf('.');
      if(i2 > 0 && SUFFIX_MARKS[f.name.slice(i2).toLowerCase()]) langs.add(SUFFIX_MARKS[f.name.slice(i2).toLowerCase()]);
    }
    const git = n.dirs.has('.git');
    if(git || langs.size) hits.push({ rel, git, langs:[...langs] });
    if(depth >= W.depth) continue;
    const layerCap = W.layer[depth] !== undefined ? W.layer[depth] : Infinity;
    let pushed = 0;
    for(const d of n.dirs){
      if(SKIP_DIRS.has(d) || d.startsWith('.')) continue;
      if(pushed >= layerCap) continue;
      pushed++;
      queue.push({ rel: rel ? rel + '/' + d : d, depth: depth + 1 });
    }
  }

  const projects = [];
  const measureDeadline = Date.now() + MEASURE_BUDGET_MS;
  for(const h of hits){
    /* 兼容模式天然拿得到 size 与 mtime（File 对象自带），无需再遍历磁盘；仍设截止时间防极端清单 */
    let size = 0, fileCount = 0, mtrunc = false, mtime = 0, readmeTxt = '';
    const langMap = new Map();
    const stack = [{ rel:h.rel, depth:0 }];
    while(stack.length && !mtrunc){
      if(Date.now() > measureDeadline){ mtrunc = true; break; }
      const cur = stack.pop();
      const n = tree.get(cur.rel);
      if(!n) continue;
      for(const f of n.files){
        if(fileCount >= MAX_MEASURE){ mtrunc = true; break; }
        fileCount++; size += f.size || 0;
        if((f.mtime || 0) > mtime) mtime = f.mtime;
        const i2 = f.name.lastIndexOf('.');
        const lang = i2 > 0 ? EXT_LANG[f.name.slice(i2).toLowerCase()] : '';
        if(lang) langMap.set(lang, (langMap.get(lang) || 0) + 1);
      }
      if(cur.depth >= 4) continue;
      for(const d of n.dirs){
        if(SKIP_DIRS.has(d) || d.startsWith('.')) continue;
        stack.push({ rel: cur.rel ? cur.rel + '/' + d : d, depth: cur.depth + 1 });
      }
    }
    /* README / package.json 是唯一需要真读文本的两个文件：用来出卡片预览与端口 */
    const samples = [], ports = [];
    const n0 = tree.get(h.rel);
    if(n0 && Date.now() < measureDeadline){
      const rd  = n0.files.find(f => /^readme(\.(md|markdown|txt|rst))?$/i.test(f.name) && f.size < 262144);
      const pkg = n0.files.find(f => f.name === 'package.json' && f.size < 131072);
      let txt = '', pkgTxt = '';
      try { if(rd) txt = await rd.file.text(); } catch(e){}
      try { if(pkg) pkgTxt = await pkg.file.text(); } catch(e){}
      if(txt){ readmeTxt = txt.slice(0, 400); samples.push({ p:rd.name, t:txt.slice(0, 4096) }); }
      if(pkgTxt) samples.push({ p:pkg.name, t:pkgTxt.slice(0, 4096) });
      ports.push(...portsFromText(pkgTxt || txt || ''));
    }
    projects.push({
      rel: h.rel,
      name: h.rel ? h.rel.split('/').pop() : rootName,
      path: joinRootPath(h.rel),
      langs: pickLangs(h.langs, langMap),
      category: h.git ? '本机扫描 · git' : '本机扫描',
      sizeBytes: size, files: fileCount, truncated: mtrunc,
      updated: new Date(mtime || Date.now()).toISOString().slice(0, 10),
      git: h.git, samples, readme: readmeTxt, ports, live: null
    });
    setScanState('正在统计 ' + projects.length + '/' + hits.length + ' 个项目…');
  }
  projects.sort((a, b) => b.sizeBytes - a.sizeBytes);

  flatFiles = list; flatTree = tree; flatRootName = rootName; pickFail = null;
  scanRoot = null; pendingAuth = [];      // 兼容模式没有句柄，也就没有「续期」一说
  scanPerm = '';                          // 兼容模式没有句柄，权限等级无从谈起
  scanRootName = rootName;
  Object.keys(dirHandles).forEach(k => { delete dirHandles[k]; });   // 切到兼容模式，清掉句柄模式的残留
  Object.keys(dirPerm).forEach(k => { delete dirPerm[k]; });
  zeroScan = {
    scannedAt: new Date().toISOString(), rootName,
    rootPath: zeroScan.rootPath || '', mode:'flat', projects,
    stats: { visited:stats.visited, depth:stats.depth, errors:0, truncated:stats.truncated, measured:projects.filter(p => !p.truncated).length }
  };
  store.write(LS.zero, zeroScan);
  if(localPorts) applyPorts();
  setScanState('');
  buildIndex(); renderAll(); syncModeBadge();

  const took = ((Date.now() - t0) / 1000).toFixed(1);
  if(!projects.length){
    toast('兼容模式扫描完成：该目录下没找到项目（已遍历 ' + stats.visited + ' 个目录，最深 ' + stats.depth + ' 层）。' +
      '项目需含 .git 或工程标记文件（package.json / CMakeLists.txt / Cargo.toml / go.mod 等）；' +
      '若项目在更深层，请改选更靠近项目的父目录。', 'warn');
  } else if(stats.truncated){
    toast('兼容模式扫描完成 · 发现 ' + projects.length + ' 个项目 · 用时 ' + took + 's（清单或遍历已达上限，结果可能不完整；建议改选更靠近项目的父目录）', 'warn');
  } else {
    toast('兼容模式扫描完成 · 发现 ' + projects.length + ' 个项目 · 用时 ' + took + 's · 可只读浏览，不能写盘', 'ok');
  }
}

/* 兼容模式：用文件清单在内存里还原目录树（只读浏览） */
/* 文件清单里的路径是相对「扫描根」的，而窗格里的 rel 是相对「项目根」的，两者要换算 */
function flatAbs(pid, rel){
  const zp = zeroById(pid);
  const base = (zp && zp.rel) ? zp.rel : '';
  return base ? (rel ? base + '/' + rel : base) : rel;
}
/* 直接查扫描时建好的目录树：O(1)，不再全量遍历几万条文件清单。
   没有树（例如刷新后清单已失效）时退回空结果，UI 会提示需要重扫一次。 */
function flatListAt(rel){
  if(!flatTree) return { dirs:[], files:[] };
  const n = flatTree.get(rel || '');
  if(!n) return { dirs:[], files:[] };
  return {
    dirs: [...n.dirs].sort((a, b) => a.localeCompare(b, 'zh')).map(x => ({ name:x })),
    files: n.files.slice().sort((a, b) => a.name.localeCompare(b.name, 'zh')).map(f => ({ name:f.name, size:f.size }))
  };
}
function flatFill(pid){
  const host = document.querySelector('[data-flat-tree]');
  if(!host) return;
  const slot = +host.dataset.flatTree;
  if(!flatFiles){
    host.innerHTML = '<div class="empty" style="padding:14px;white-space:normal">' +
      '兼容模式的只读浏览依赖本次会话的文件清单，刷新后已失效 · 到控制室点一次「兼容模式扫描」即可恢复</div>';
    return;
  }
  const rel = (panesOfProject(pid)[slot] || {}).content || '';
  const { dirs, files } = flatListAt(flatAbs(pid, rel));
  host.innerHTML = dirs.concat(files).map(e => {
    const isDir = e.size === undefined;
    const full = rel ? rel + '/' + e.name : e.name;
    return '<button class="tree-row" data-act="repo-' + (isDir ? 'nav' : 'open') + '" data-slot="' + slot + '" data-rel="' + esc(full) + '">' +
      '<span class="ic">' + (isDir ? '▸' : '·') + '</span><span class="nm">' + esc(e.name) + (isDir ? '/' : '') + '</span>' +
      (isDir ? '' : '<span class="sz">' + fmtBytes(e.size) + '</span>') + '</button>';
  }).join('') || '<div class="empty" style="padding:14px">该目录为空</div>';
  const rv = repoView[repoKey(pid, rel)];
  if(rv && rv.file) flatOpen(pid, slot, rel ? rel + '/' + rv.file : rv.file);
}
async function flatOpen(pid, slot, rel){
  const host = document.querySelector('[data-flat-file="' + slot + '"]');
  if(!host) return;
  const head = '<div class="file-head"><span class="fp">' + esc(rel) + '</span>' +
    '<button class="mini-btn" data-act="repo-close" data-slot="' + slot + '">关闭</button></div>';
  const f = flatFiles && flatFiles.get(flatAbs(pid, rel));
  if(!f){ host.innerHTML = head + '<div class="note-line"><i>◇</i>文件不在本次清单内（刷新后需重扫一次）</div>'; return; }
  if(f.size > 524288){
    host.innerHTML = head + '<div class="note-line"><i>◇</i>文件 ' + fmtBytes(f.size) + ' 超过 512KB，不在窗格内打开</div>';
    toast('文件过大，未在窗格内打开', 'warn');
    return;
  }
  try {
    const txt = await f.text();
    host.innerHTML = head + '<pre class="code">' + esc(txt) + '</pre>' +
      '<div class="pane-meta"><span>兼容模式只读浏览 · 不写盘</span><span>' + txt.length + ' 字符</span></div>';
    toast('已读取 ' + rel + '（只读）', 'ok');
  } catch(e){
    host.innerHTML = head + '<div class="note-line"><i>◇</i>读取失败：' + esc(e.message || e) + '</div>';
  }
}

/* ---- 端口试探（近似值：浏览器无法枚举本机端口，只探常见端口） ---- */
const PROBE_PORTS = [3000,3001,3210,3080,3306,4000,4321,5000,5173,5174,5432,6379,7000,7331,7332,7333,
  8000,8001,8080,8081,8443,8888,9000,9090,9200,11434,27017];
async function probeLocalPorts(){
  if(typeof fetch !== 'function'){ toast('当前环境不支持端口探测', 'warn'); return; }
  const btn = document.getElementById('dirProbeBtn');
  if(btn){ btn.disabled = true; btn.textContent = '探测中…'; }
  const hits = [];
  await Promise.all(PROBE_PORTS.map(async port => {
    let ctl = null, timer = null;
    if(typeof AbortController === 'function'){ ctl = new AbortController(); timer = setTimeout(() => ctl.abort(), 900); }
    try {
      await fetch('http://127.0.0.1:' + port + '/', ctl ? { mode:'no-cors', cache:'no-store', signal:ctl.signal } : { mode:'no-cors', cache:'no-store' });
      hits.push({ port, proc:'本机监听（近似）', address:'127.0.0.1' });
    } catch(e){}
    if(timer) clearTimeout(timer);
  }));
  hits.sort((a, b) => a.port - b.port);
  localPorts = { scannedAt:new Date().toISOString(), ports:hits, attempted:PROBE_PORTS.length };
  applyPorts();
  renderAll();
  if(btn){ btn.disabled = false; btn.textContent = '探测端口'; }
  toast('端口探测完成 · 命中 ' + hits.length + ' 个（近似，浏览器无法枚举全端口）', hits.length ? 'ok' : 'warn');
}
function applyPorts(){
  if(!localPorts) return;
  const open = new Set(localPorts.ports.map(x => x.port));
  (zeroScan.projects || []).forEach(sp => {
    const hit = (sp.ports || []).find(pt => open.has(pt));
    sp.live = hit ? { port:hit, proc:'本机监听（近似）' } : null;
  });
  store.write(LS.zero, zeroScan);
}

/* 零服务模式：把「扫描根 + 相对路径」解析成项目目录句柄，repo 窗格随即可读写 */
async function ensureZeroHandle(pid){
  if(SERVER || dirHandles[pid] || zeroPending[pid] || !scanRoot) return;
  const zp = zeroProjects().find(p => p.id === pid);
  if(!zp) return;
  zeroPending[pid] = true;
  try {
    /* 只读即可建句柄：浏览与读取都只需要读权限，写留给「保存」时再升级。
       旧版卡在 readwrite 上，导致只读目录里 repo 窗格连目录树都出不来。 */
    let lv = scanPerm;
    if(lv !== 'read' && lv !== 'write') lv = await permLevel(scanRoot);
    if(lv !== 'read' && lv !== 'write') return;
    let cur = scanRoot;
    if(zp.rel) for(const seg of zp.rel.split('/')) cur = await cur.getDirectoryHandle(seg);
    dirHandles[pid] = cur; dirPerm[pid] = lv;
    if(activeId === pid) renderSplit();
  } catch(e){ /* 目录被移动或删除，降级为快照视图 */ }
  finally { zeroPending[pid] = false; }
}

async function scanRefresh(slot){
  if(!SERVER){
    if(scanRoot){ await scanRootNow(); renderProjPane(slot); return; }
    toast('实时重扫需先在控制室授权一个本机目录，或双击「启动工作台.bat」起本地服务', 'warn');
    return;
  }
  const btn = document.querySelector('[data-act="scan-refresh"][data-slot="' + slot + '"]');
  if(btn){ btn.disabled = true; btn.textContent = '扫描中…'; }
  try {
    scanCache = await srvJson('/api/scan');
    toast('索引已刷新 · 发现 ' + ((scanCache.projects || []).length) + ' 个项目', 'ok');
  } catch(e){
    toast('重扫失败：' + (e.message || e), 'warn');
  }
  if(btn){ btn.disabled = false; btn.textContent = '刷新索引'; }
  renderProjPane(slot);
}

function addFromScan(path, name, langs, sizeBytes, files, updated, git){
  if(!path){ toast('该项目没有可用路径，无法加入', 'warn'); return; }
  custom.push({
    id:'custom-' + Date.now(), name, alias:name, path,
    langs: langs ? langs.split(',').filter(Boolean) : ['Other'],
    category:'扫描加入',
    sizeMB: Math.round(((Number(sizeBytes) || 0) / 1048576) * 10) / 10,
    files: Number(files) || 0,
    git: git === '1',
    updated: updated || new Date().toISOString().slice(0, 10),
    custom:true
  });
  store.write(LS.custom, custom);
  renderAll();
  toast('已加入工作台：' + name, 'ok');
}

/* ---------- AI 对话窗格的动作 ---------- */
function fbSet(key, title, detail, show){
  const fb = document.querySelector('[data-fallback="' + key + '"]');
  if(!fb) return;
  if(title){
    const slot = key.replace(/^chat-/, '');
    fb.innerHTML = '<b>' + esc(title) + '</b><span>' + esc(detail) + '</span>' +
      '<span class="fb-row"><button class="btn small" data-act="hide-fallback" data-fallback="' + esc(key) + '">仍然显示内嵌页</button>' +
      '<button class="btn small primary" data-act="chat-open" data-slot="' + esc(slot) + '">在新标签打开</button></span>';
  }
  fb.style.display = show ? 'flex' : 'none';
}

async function chatReload(slot){
  if(!activeId) return;
  const pane = panesOfProject(activeId)[slot];
  const url = normalizeUrl((pane && pane.content) || '');
  const key = 'chat-' + slot;
  const frame = document.querySelector('[data-frame="' + key + '"]');
  if(!url){ toast('请先填写 AI 地址', 'warn'); return; }
  if(pane) pane.content = url;
  const inp = document.querySelector('[data-field="chat-url"][data-slot="' + slot + '"]');
  if(inp && inp.value !== url) inp.value = url;

  if(!SERVER){
    if(frame) frame.src = url;
    fbSet(key, '可能被站点拒绝内嵌', '快照模式无法探测可嵌入性。若长时间空白，多为该站点设置了 X-Frame-Options 或 CSP。', true);
    toast('已载入 ' + url + ' · 若空白请点「新标签」');
    return;
  }

  fbSet(key, '正在探测…', url, true);
  try {
    const j = await srvJson('/api/probe?url=' + encodeURIComponent(url));
    if(!j.ok){ fbSet(key, '站点返回 HTTP ' + j.status, '上游拒绝了请求，请确认地址可访问，或改用「新标签」打开。', true); return; }
    if(!j.embeddable){ fbSet(key, '该地址不是网页', 'content-type 为 ' + (j.contentType || '未知') + '，无法作为网页内嵌。', true); return; }
    /* 探测已发现封锁头就直接给兜底，不要先假装成功、再让用户对着空白页发呆 */
    if(j.frameBlock){
      if(frame) frame.src = url;
      fbSet(key, '该站点声明了禁止内嵌', j.frameBlock + '。内嵌大概率是空白页，建议改用「新标签」或本机自托管的 AI 前端。', true);
      return;
    }
    if(frame) frame.src = url;
    fbSet(key, '', '', false);
    toast('已内嵌 ' + url, 'ok');
  } catch(e){
    fbSet(key, '探测失败', String(e.message || e), true);
  }
}

function copyContext(pid){
  const p = projectById(pid);
  if(!p){ toast('没有可复制的项目', 'warn'); return; }
  const { dirs, files } = listAt(pid, '');
  const lines = [
    '## 项目：' + (p.alias || p.name) + '（' + p.name + '）',
    '- 路径：' + p.path,
    '- 语言：' + ((p.langs || []).join(', ') || '—'),
    '- 类别 / 体积 / 更新：' + (p.category || '—') + ' / ' + fmtSize(p.sizeMB, p.estimated) + ' / ' + (p.updated || '—'),
    '- 运行中端口：' + (p.live ? ':' + p.live.port + ' · ' + p.live.proc : '未监听'),
    '### 目录结构（快照摘要）',
    '```',
    dirs.slice(0, 14).map(d => d.name + '/').join('\n') || '（无子目录）'
  ];
  if(files.length) lines.push(files.slice(0, 10).map(f => f.name).join('\n'));
  lines.push('```');
  copyText(lines.join('\n'), '已复制项目上下文 · 粘贴到 AI 对话框即可');
}

/* ============================================================
   事件委托
   ============================================================ */
const root = document.body;

root.addEventListener('click', e => {
  const nav = e.target.closest('[data-view]');
  if(nav){ setView(nav.dataset.view); return; }

  const el = e.target.closest('[data-act]');
  if(!el) return;
  const a = el.dataset.act;
  const slot = el.dataset.slot === undefined || el.dataset.slot === '' ? null : +el.dataset.slot;

  switch(a){
    case 'cycle-status': e.stopPropagation(); cycleStatus(el.dataset.pid); break;
    case 'open-project':
      e.stopPropagation();
      if(selectMode && el.classList.contains('pitem')){ toggleSel(el.dataset.pid); break; }
      openProject(el.dataset.pid);
      break;
    case 'toggle-select': setSelectMode(!selectMode); break;
    case 'sel-all':       listSelectAll(); break;
    case 'sel-none':      clearSel(); break;
    case 'sel-delete':    deleteSelected(); break;
    case 'restore-removed': restoreRemoved(); break;
    case 'close-project': closeProject(); break;
    case 'goto-control':  setView('control'); break;
    case 'focus-search': {
      setView('control');
      setTimeout(() => { const i = document.getElementById('searchInput'); if(i && i.focus) i.focus(); }, 40);
      break;
    }
    case 'set-preset':    setPreset(el.dataset.preset); break;
    case 'pane-kind':     setPaneKind(slot, el.dataset.kind); break;
    case 'clear-pane':    clearPane(slot); break;
    case 'reset-panes':   resetPanes(); break;
    case 'todo-toggle':   todoToggle(slot, +el.dataset.idx); break;
    case 'todo-del':      todoDel(slot, +el.dataset.idx); break;
    case 'todo-add': {
      const inp = document.querySelector('[data-field="todo-new"][data-slot="' + slot + '"]');
      if(inp){ todoAdd(slot, inp.value); }
      break;
    }
    case 'copy-path':     copyText((projectById(el.dataset.pid) || {}).path || ''); break;
    case 'copy-text':     copyText(el.dataset.text || ''); break;
    case 'open-url': {
      const pane = panesOfProject(activeId)[slot];
      openUrl(pane.content || '');
      break;
    }
    case 'reload-frame': {
      const f = document.querySelector('[data-frame="' + slot + '"]');
      const fb = document.querySelector('[data-fallback="' + slot + '"]');
      if(fb) fb.style.display = 'flex';
      if(f){ const pane = panesOfProject(activeId)[slot]; f.src = pane.content || ''; }
      toast('已重载内嵌页面');
      break;
    }
    case 'hide-fallback': {
      const key = el.dataset.fallback !== undefined ? el.dataset.fallback : String(slot);
      const fb = document.querySelector('[data-fallback="' + key + '"]');
      if(fb) fb.style.display = 'none';
      toast('已隐藏提示层 · 若空白说明服务未运行或禁止内嵌');
      break;
    }
    case 'repo-nav':      repoNav(slot === null ? (el.dataset.navrel !== undefined ? repoSlotOf(el) : 0) : slot, el.dataset.rel || ''); break;
    case 'repo-open':     repoOpen(slot, el.dataset.rel); break;
    case 'repo-close':    repoClose(slot); break;
    case 'connect-dir':   connectDir(el.dataset.pid); break;
    case 'live-nav': {
      const pid = el.dataset.pid, s = +el.dataset.slot;
      panesOfProject(pid)[s].content = el.dataset.rel;
      persistPanes();
      renderSplit();
      break;
    }
    case 'live-open':     liveOpen(el.dataset.pid, +el.dataset.slot, el.dataset.rel); break;
    case 'live-save':     liveSave(el.dataset.pid, el.dataset.rel, el); break;
    case 'srv-nav': {
      const s = +el.dataset.slot;
      panesOfProject(activeId)[s].content = el.dataset.rel || '';
      persistPanes();
      renderSplit();
      break;
    }
    case 'srv-open': {
      const s = +el.dataset.slot;
      const rel = el.dataset.rel || '';
      const parts = rel.split('/');
      const name = parts.pop();
      srvOpen(activeId, s, parts.join('/'), name);
      break;
    }
    case 'srv-save':      srvSave(+el.dataset.slot, el.dataset.rel, el); break;
    case 'srv-close': {
      const s = +el.dataset.slot;
      delete repoView[repoKey(activeId, panesOfProject(activeId)[s].content || '')];
      const host = document.querySelector('[data-srv-file="' + s + '"]');
      if(host) host.innerHTML = '';
      break;
    }
    case 'proj-open':     openProject(el.dataset.pid); break;
    case 'proj-add':      addFromScan(el.dataset.path, el.dataset.name, el.dataset.langs, el.dataset.size, el.dataset.files, el.dataset.updated, el.dataset.git); break;
    case 'proj-group':    projGroup = el.dataset.group; renderProjPane(+el.dataset.slot); break;
    case 'proj-filter':   projFilter = el.dataset.filter; renderProjPane(+el.dataset.slot); break;
    case 'scan-refresh':  scanRefresh(+el.dataset.slot); break;
    case 'chat-reload':   chatReload(+el.dataset.slot); break;
    case 'chat-open': {
      const pane = panesOfProject(activeId)[+el.dataset.slot];
      openUrl((pane && pane.content) || '');
      break;
    }
    case 'copy-context':  copyContext(el.dataset.pid); break;
    case 'mode-help':
      if(SERVER) toast('本地服务已接管文件读写 · 仓库窗格无需点选目录', 'ok');
      else toast('快照模式只读：双击「启动工作台.bat」起本地服务后即可读写文件', 'warn');
      break;
    case 'filter-state':
      stateFilter = el.dataset.state;
      store.write(LS.filter, stateFilter);
      renderControl();
      toast(stateFilter === 'all' ? '已显示全部状态' : '筛选：' + STATES[stateFilter].label);
      break;
    case 'refresh':
      toast('视图已刷新 · 数据来自本地扫描快照 ' + DATA.snapshot, 'ok');
      renderAll();
      break;
    case 'add-project':   openModal(); break;
    case 'close-modal':   closeModal(); break;
    case 'confirm-add':   confirmAdd(); break;
    case 'remove-custom': {
      custom = custom.filter(x => x.id !== el.dataset.pid);
      store.write(LS.custom, custom);
      if(activeId === el.dataset.pid) closeProject();
      renderAll();
      toast('已移除自定义项目', 'warn');
      break;
    }
    case 'dir-pick':      pickScanRoot(); break;
    case 'dir-flat':      pickFlatRoot(); break;
    case 'dir-resume':    resumeScanRoot(); break;
    /* 扫描中再点一次＝取消，避免在超大根目录上干等又没法中断 */
    case 'dir-scan':      if(scanning){ scanAbort = true; setScanState('正在取消…'); } else scanRootNow(); break;
    case 'dir-deep':      deepScan = !deepScan; renderDirBar();
                          toast(deepScan ? '深度扫描已开：最多 20000 个目录 / 8 层，最长约 1 分钟' : '已恢复普通扫描', deepScan ? 'warn' : 'ok'); break;
    case 'dir-probe':     probeLocalPorts(); break;
    case 'dir-clear':     clearScanRoot(); break;
  }
});

      body: JSON.stringify({ id:rec.id, name:rec.name, path:rec.path })

}

/* ============================================================
   项目栏多选移除 / 恢复
   ============================================================ */
function setSelectMode(on){
  selectMode = !!on;
  if(!selectMode){ selected.clear(); armedDelete = false; }
  renderPlist();
  toast(selectMode ? '多选已开启 · 勾选项目后点「移除」' : '已退出多选');
}
function toggleSel(pid){
  if(selected.has(pid)) selected.delete(pid); else selected.add(pid);
  armedDelete = false;
  renderPlist();
}
function clearSel(){ selected.clear(); armedDelete = false; renderPlist(); }
function listSelectAll(){
  const list = allProjects();
  if(list.length && selected.size === list.length) selected.clear();
  else list.forEach(p => selected.add(p.id));
  armedDelete = false;
  renderPlist();
}
function deleteSelected(){
  if(!selected.size){ toast('先勾选要移除的项目', 'warn'); return; }
  if(!armedDelete){
    armedDelete = true;
    renderPlist();
    toast('再点一次「确认移除」才会生效 · 磁盘上的文件不会被删除', 'warn');
    return;
  }
  const ids = Array.from(selected);
  const customs = ids.filter(id => custom.some(c => c.id === id));
  if(customs.length) custom = custom.filter(c => customs.indexOf(c.id) < 0);
  ids.forEach(id => { if(customs.indexOf(id) < 0 && removed.indexOf(id) < 0) removed.push(id); });
  store.write(LS.custom, custom);
  store.write(LS.removed, removed);
  if(activeId && ids.indexOf(activeId) >= 0){ activeId = null; store.write(LS.active, null); }
  selected.clear(); armedDelete = false; selectMode = false;
  renderAll();
  toast('已从项目栏移除 ' + ids.length + ' 个项目' +
        (customs.length ? '（其中 ' + customs.length + ' 个自定义项需重新添加）' : '') +
        ' · 磁盘文件未动', 'warn');
}
function restoreRemoved(){
  if(!removed.length) return;
  const n = removed.length;
  removed = [];
  store.write(LS.removed, removed);
  renderAll();
  toast('已恢复 ' + n + ' 个扫描项目', 'ok');
}

/* ============================================================
   启动
   ============================================================ */
buildIndex();
if(activeId && !projectById(activeId)) activeId = null;
if(activeId && !presetOf[activeId]) presetOf[activeId] = 'l13';
renderAll();
if(view === 'workbench' && activeId) toast('已恢复上次的工作台：' + (projectById(activeId) || {}).alias);
detectServer();
restoreScanRoot();
</script>
