/* ============================================================
   运行模式（快照只读 / 本地服务可读写）
   ============================================================ */
function syncModeBadge(){
  const el = document.getElementById('modeBadge');
  if(!el) return;
  el.className = 'mode-badge' + (SERVER ? ' on' : '');
  const port = (typeof location !== 'undefined' && location.port) ? ':' + location.port : '';
  el.innerHTML = SERVER ? '<i>●</i>本地服务 · 可读写' : '<i>◇</i>快照模式 · 只读';
  el.title = SERVER
    ? '本地服务已接管' + port + '，仓库窗格可直接读写磁盘文件'
    : '快照模式为只读：双击「启动工作台.bat」起本地服务后即可读写文件';
}

function detectServer(){
  syncModeBadge();
  if(typeof location !== 'undefined' && location.protocol === 'file:') return;
  if(typeof fetch !== 'function') return;
  let ctl = null, timer = null;
  if(typeof AbortController === 'function'){ ctl = new AbortController(); timer = setTimeout(() => ctl.abort(), 900); }
  Promise.resolve(fetch('/api/health', ctl ? { signal:ctl.signal } : {}))
    .then(res => (res && res.ok) ? res.json() : null)
    .then(j => {
      if(!j || !j.ok) return;
      SERVER = true;
      if(Array.isArray(j.aiPresets) && j.aiPresets.length) AI_PRESETS = j.aiPresets.slice();
      syncModeBadge();
      if(activeId) renderSplit();
      toast('已连接本地服务 · 仓库窗格可直接读写文件', 'ok');
    })
    .catch(() => {})
    .then(() => { if(timer) clearTimeout(timer); });
}

function syncView(){
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.id === 'view-' + view));
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  const meta = view === 'control'
    ? { t:'控制室', e:'Control Room' }
    : { t: activeId ? (projectById(activeId) || {}).alias || '分栏工作台' : '项目工作台', e: activeId ? 'Split Workbench' : 'Workspace' };
  document.getElementById('viewTitle').textContent = meta.t;
  document.getElementById('viewEyebrow').textContent = meta.e;
  const c = countByState();
  document.getElementById('viewSub').textContent = view === 'control'
    ? '快照 ' + DATA.snapshot + ' · ' + allProjects().length + ' 个项目 · 进行中 ' + c.working + ' · 待处理 ' + c['needs-you'] + ' · 磁盘 ' + (diskTotalMB()/1024).toFixed(2) + ' GB'
    : '快照 ' + DATA.snapshot + ' · ' + allProjects().length + ' 个项目 · 磁盘 ' + (diskTotalMB()/1024).toFixed(2) + ' GB · 点卡片进入分栏工作台';
  const g = document.getElementById('wbGrid'), s = document.getElementById('wbSplit');
  const split = view === 'workbench' && !!activeId;
  g.style.display = split ? 'none' : '';
  s.style.display = split ? '' : 'none';
  const wbStats = document.getElementById('wbStats');
  if(wbStats) wbStats.innerHTML = statsHTML(false);
}

function setView(v){
  view = v;
  store.write(LS.view, v);
  if(v === 'workbench' && activeId === null) { /* 保持卡片网格 */ }
  syncView();
  toast(v === 'control' ? '已进入控制室' : '已切换到项目工作台');
}

/* ============================================================
   交互
   ============================================================ */
function cycleStatus(pid){
  const cur = stOf(pid);
  const next = STATE_ORDER[(STATE_ORDER.indexOf(cur) + 1) % STATE_ORDER.length];
  status[pid] = next;
  store.write(LS.status, status);
  renderAll();
  toast((projectById(pid) || {}).alias + ' → ' + STATES[next].label, next === 'done' ? 'ok' : (next === 'needs-you' ? 'warn' : 'info'));
}

function openProject(pid){
  if(!projectById(pid)) return;
  activeId = pid;
  store.write(LS.active, pid);
  if(!panesOf[pid]) panesOfProject(pid);
  if(!presetOf[pid]) presetOf[pid] = 'l13';
  view = 'workbench';
  store.write(LS.view, view);
  renderAll();
  const p = projectById(pid);
  toast('已进入 ' + p.alias + ' · 布局 ' + PRESETS[presetOfProject(pid)].label);
}

function closeProject(){
  activeId = null;
  store.write(LS.active, null);
  renderAll();
  toast('已回到全部项目');
}

function setPreset(k){
  if(!PRESETS[k] || !activeId) return;
  presetOf[activeId] = k;
  store.write(LS.preset, presetOf);
  let auto = false;
  if(k === 'chat'){
    const panes = panesOfProject(activeId);
    if(panes[1] && panes[1].kind === 'placeholder'){
      panes[1] = { kind:'chat', title: KINDS.chat.label, content: AI_PRESETS[0] ? AI_PRESETS[0].url : '' };
      persistPanes();
      auto = true;
    }
  }
  renderAll();
  toast('布局切换为「' + PRESETS[k].label + '」 · ' + PRESETS[k].slots + ' 个窗格' + (auto ? ' · 右侧已放入 AI 对话' : ''));
}

function setPaneKind(slot, kind){
  if(!activeId || !KINDS[kind]) return;
  const panes = panesOfProject(activeId);
  const old = panes[slot];
  let content;
  if(kind === 'note') content = '';
  else if(kind === 'todo') content = [];
  else if(kind === 'link') content = 'https://';
  else if(kind === 'web') content = 'http://localhost:5173';
  else if(kind === 'repo') content = '';
  else if(kind === 'projects') content = null;
  else if(kind === 'chat') content = (AI_PRESETS[0] ? AI_PRESETS[0].url : '');
  else content = null;
  panes[slot] = { kind, title: KINDS[kind].label, content };
  persistPanes();
  renderSplit();
  toast('窗格 ' + (slot + 1) + ' → ' + KINDS[kind].label);
}

function clearPane(slot){
  if(!activeId) return;
  const panes = panesOfProject(activeId);
  panes[slot] = { kind:'placeholder', title:'预留位', content:null };
  persistPanes();
  renderSplit();
  toast('已清空窗格 ' + (slot + 1), 'warn');
}

function resetPanes(){
  if(!activeId) return;
  panesOf[activeId] = defaultPanes(projectById(activeId));
  persistPanes();
  renderSplit();
  toast('已重置本项目窗格', 'warn');
}

function repoNav(slot, rel){
  if(!activeId) return;
  const panes = panesOfProject(activeId);
  panes[slot].content = rel || '';
  persistPanes();
  delete repoView[repoKey(activeId, rel || '')];
  renderSplit();
}

function repoOpen(slot, rel){
  if(!activeId) return;
  const key = repoKey(activeId, rel);
  repoView[key] = { file: rel.split('/').pop() };
  renderSplit();
  const txt = sampleOf(activeId, rel);
  toast(txt ? '已载入 ' + rel + ' 的快照内容' : rel + ' 未内嵌预览（点复制路径用编辑器打开）', txt ? 'ok' : 'warn');
}

function repoClose(slot){
  if(!activeId) return;
  const panes = panesOfProject(activeId);
  delete repoView[repoKey(activeId, panes[slot].content || '')];
  renderSplit();
}

function todoToggle(slot, idx){
  if(!activeId) return;
  const pane = panesOfProject(activeId)[slot];
  if(pane.kind !== 'todo' || !pane.content[idx]) return;
  pane.content[idx].done = !pane.content[idx].done;
  persistPanes();
  renderSplit();
}
function todoDel(slot, idx){
  if(!activeId) return;
  const pane = panesOfProject(activeId)[slot];
  pane.content.splice(idx, 1);
  persistPanes();
  renderSplit();
}
function todoAdd(slot, text){
  if(!activeId || !text.trim()) return;
  const pane = panesOfProject(activeId)[slot];
  pane.content.push({ t: text.trim(), done:false });
  persistPanes();
  renderSplit();
  toast('已添加待办：' + text.trim(), 'ok');
}

function copyText(text, label){
  const done = () => toast(label || '已复制到剪贴板', 'ok');
  const fail = () => toast('复制失败，请手动选择', 'warn');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => legacy());
  } else legacy();
  function legacy(){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ fail(); }
    ta.remove();
  }
}

function openUrl(url){
  if(!url){ toast('请先填写网址', 'warn'); return; }
  const w = window.open(url, '_blank', 'noopener');
  if(w) toast('已在新标签打开 ' + url, 'ok');
  else toast('浏览器拦截了新标签，请允许弹出窗口', 'warn');
}

/* ---------- 连接真实目录（File System Access API） ---------- */
async function connectDir(pid){
  if(SERVER){ toast('本地服务已接管读写，无需再连接目录', 'ok'); return; }
  const fileProto = typeof location !== 'undefined' && location.protocol === 'file:';
  if(!window.showDirectoryPicker){
    toast('当前浏览器不支持目录访问（需 Chrome / Edge 86+）', 'warn');
    return;
  }
  try {
    const handle = await window.showDirectoryPicker({ mode:'readwrite', id:'wt-' + pid });
    dirHandles[pid] = handle;
    toast('已连接目录 ' + handle.name + ' · 可读写', 'ok');
    renderSplit();
  } catch(e){
    if(e && e.name === 'AbortError'){ toast('已取消选择目录'); return; }
    const why = fileProto
      ? 'file:// 不是安全上下文，浏览器直接拦掉了目录选择器 —— 这不是本页的 bug。'
      : '浏览器拒绝了目录选择器：' + (e && e.message ? e.message : e);
    toast(why + ' 解决办法：双击「启动工作台.bat」，用 http://127.0.0.1 打开即可零点击读写文件。', 'warn');
  }
}

async function surviveLive(pid){
  const host = document.querySelector('[data-live-tree]');
  if(!host) return;
  const handle = dirHandles[pid];
  const panes = panesOfProject(pid);
  const slot = +host.dataset.liveTree;
  const rel = panes[slot].content || '';
  try {
    let cur = handle;
    for(const seg of (rel ? rel.split('/') : [])){
      cur = await cur.getDirectoryHandle(seg);
    }
    const dirs = [], files = [];
    for await (const [name, h] of cur.entries()){
      if(name === '.git' || name === 'node_modules') continue;
      if(h.kind === 'directory') dirs.push({ name, dir:true });
      else { let size = 0; try { size = (await h.getFile()).size; } catch(e){} files.push({ name, dir:false, size }); }
    }
    dirs.sort((a,b) => a.name.localeCompare(b.name, 'zh'));
    files.sort((a,b) => a.name.localeCompare(b.name, 'zh'));
    host.innerHTML = dirs.concat(files).map(e =>
      '<button class="tree-row" data-act="live-' + (e.dir ? 'nav' : 'open') + '" data-pid="' + esc(pid) + '" data-slot="' + slot + '" data-rel="' + esc(rel ? rel + '/' + e.name : e.name) + '">' +
      '<span class="ic">' + (e.dir ? '▸' : '·') + '</span><span class="nm">' + esc(e.name) + (e.dir ? '/' : '') + '</span>' +
      (e.dir ? '' : '<span class="sz">' + fmtBytes(e.size) + '</span>') + '</button>').join('') ||
      '<div class="empty" style="padding:14px">空目录</div>';
  } catch(e){
    host.innerHTML = '<div class="empty" style="padding:14px">读取失败：' + esc(e.message || e) + '</div>';
  }
}

async function liveOpen(pid, slot, rel){
  const handle = dirHandles[pid];
  if(!handle) return;
  try {
    let cur = handle;
    const segs = rel.split('/');
    const name = segs.pop();
    for(const seg of segs) cur = await cur.getDirectoryHandle(seg);
    const fh = await cur.getFileHandle(name);
    const file = await fh.getFile();
    if(file.size > 524288){ toast('文件超过 512KB，不在窗格内打开', 'warn'); return; }
    const text = await file.text();
    const host = document.querySelector('[data-live-file]');
    if(!host) return;
    host.innerHTML = '<div class="file-head"><span class="fp">' + esc(rel) + ' · ' + fmtBytes(file.size) + '</span>' +
      '<button class="btn small primary" data-act="live-save" data-pid="' + esc(pid) + '" data-rel="' + esc(rel) + '">保存</button></div>' +
      '<textarea class="note-area" style="min-height:210px;font-family:var(--mono);font-size:11.5px" data-live-text>' + esc(text) + '</textarea>';
    toast('已读取 ' + rel, 'ok');
  } catch(e){ toast('读取失败：' + (e.message || e), 'warn'); }
}

async function liveSave(pid, rel, btn){
  const handle = dirHandles[pid];
  const ta = document.querySelector('[data-live-text]');
  if(!handle || !ta) return;
  try {
    let cur = handle;
    const segs = rel.split('/');
    const name = segs.pop();
    for(const seg of segs) cur = await cur.getDirectoryHandle(seg);
    const fh = await cur.getFileHandle(name, { create:true });
    const w = await fh.createWritable();
    await w.write(ta.value);
    await w.close();
    toast('已写入磁盘：' + rel, 'ok');
    if(btn) btn.textContent = '已保存';
  } catch(e){ toast('写入失败：' + (e.message || e), 'warn'); }
}

/* ---------- 本地检索窗格的动作 ---------- */
async function scanRefresh(slot){
  if(!SERVER){ toast('实时重扫需要本地服务：双击「启动工作台.bat」后用 http://127.0.0.1 打开', 'warn'); return; }
  const btn = document.querySelector('[data-act="scan-refresh"][data-slot="' + slot + '"]');
  if(btn){ btn.disabled = true; btn.textContent = '扫描中…'; }
  try {
    scanCache = await srvJson('/api/scan');
    toast('索引已刷新 · 发现 ' + ((scanCache.projects || []).length) + ' 个项目', 'ok');
  } catch(e){
    toast('重扫失败：' + (e.message || e), 'warn');
  }
  if(btn){ btn.disabled = false; btn.textContent = '刷新索引'; }
  renderProjPane(slot);
}

function addFromScan(path, name, langs, sizeBytes, files, updated, git){
  if(!path){ toast('该项目没有可用路径，无法加入', 'warn'); return; }
  custom.push({
    id:'custom-' + Date.now(), name, alias:name, path,
    langs: langs ? langs.split(',').filter(Boolean) : ['Other'],
    category:'扫描加入',
    sizeMB: Math.round(((Number(sizeBytes) || 0) / 1048576) * 10) / 10,
    files: Number(files) || 0,
    git: git === '1',
    updated: updated || new Date().toISOString().slice(0, 10),
    custom:true
  });
  store.write(LS.custom, custom);
  renderAll();
  toast('已加入工作台：' + name, 'ok');
}

/* ---------- AI 对话窗格的动作 ---------- */
function fbSet(key, title, detail, show){
  const fb = document.querySelector('[data-fallback="' + key + '"]');
  if(!fb) return;
  if(title){
    const slot = key.replace(/^chat-/, '');
    fb.innerHTML = '<b>' + esc(title) + '</b><span>' + esc(detail) + '</span>' +
      '<span class="fb-row"><button class="btn small" data-act="hide-fallback" data-fallback="' + esc(key) + '">仍然显示内嵌页</button>' +
      '<button class="btn small primary" data-act="chat-open" data-slot="' + esc(slot) + '">在新标签打开</button></span>';
  }
  fb.style.display = show ? 'flex' : 'none';
}

async function chatReload(slot){
  if(!activeId) return;
  const pane = panesOfProject(activeId)[slot];
  const url = normalizeUrl((pane && pane.content) || '');
  const key = 'chat-' + slot;
  const frame = document.querySelector('[data-frame="' + key + '"]');
  if(!url){ toast('请先填写 AI 地址', 'warn'); return; }
  if(pane) pane.content = url;
  const inp = document.querySelector('[data-field="chat-url"][data-slot="' + slot + '"]');
  if(inp && inp.value !== url) inp.value = url;

  if(!SERVER){
    if(frame) frame.src = url;
    fbSet(key, '可能被站点拒绝内嵌', '快照模式无法探测可嵌入性。若长时间空白，多为该站点设置了 X-Frame-Options 或 CSP。', true);
    toast('已载入 ' + url + ' · 若空白请点「新标签」');
    return;
  }

  fbSet(key, '正在探测…', url, true);
  try {
    const j = await srvJson('/api/probe?url=' + encodeURIComponent(url));
    if(!j.ok){ fbSet(key, '站点返回 HTTP ' + j.status, '上游拒绝了请求，请确认地址可访问，或改用「新标签」打开。', true); return; }
    if(!j.embeddable){ fbSet(key, '该地址不是网页', 'content-type 为 ' + (j.contentType || '未知') + '，无法作为网页内嵌。', true); return; }
    /* 探测已发现封锁头就直接给兜底，不要先假装成功、再让用户对着空白页发呆 */
    if(j.frameBlock){
      if(frame) frame.src = url;
      fbSet(key, '该站点声明了禁止内嵌', j.frameBlock + '。内嵌大概率是空白页，建议改用「新标签」或本机自托管的 AI 前端。', true);
      return;
    }
    if(frame) frame.src = url;
    fbSet(key, '', '', false);
    toast('已内嵌 ' + url, 'ok');
  } catch(e){
    fbSet(key, '探测失败', String(e.message || e), true);
  }
}

function copyContext(pid){
  const p = projectById(pid);
  if(!p){ toast('没有可复制的项目', 'warn'); return; }
  const { dirs, files } = listAt(pid, '');
  const lines = [
    '## 项目：' + (p.alias || p.name) + '（' + p.name + '）',
    '- 路径：' + p.path,
    '- 语言：' + ((p.langs || []).join(', ') || '—'),
    '- 类别 / 体积 / 更新：' + (p.category || '—') + ' / ' + fmtSize(p.sizeMB) + ' / ' + (p.updated || '—'),
    '- 运行中端口：' + (p.live ? ':' + p.live.port + ' · ' + p.live.proc : '未监听'),
    '### 目录结构（快照摘要）',
    '```',
    dirs.slice(0, 14).map(d => d.name + '/').join('\n') || '（无子目录）'
  ];
  if(files.length) lines.push(files.slice(0, 10).map(f => f.name).join('\n'));
  lines.push('```');
  copyText(lines.join('\n'), '已复制项目上下文 · 粘贴到 AI 对话框即可');
}

/* ============================================================
   事件委托
   ============================================================ */
const root = document.body;

root.addEventListener('click', e => {
  const nav = e.target.closest('[data-view]');
  if(nav){ setView(nav.dataset.view); return; }

  const el = e.target.closest('[data-act]');
  if(!el) return;
  const a = el.dataset.act;
  const slot = el.dataset.slot === undefined || el.dataset.slot === '' ? null : +el.dataset.slot;

  switch(a){
    case 'cycle-status': e.stopPropagation(); cycleStatus(el.dataset.pid); break;
    case 'open-project':  e.stopPropagation(); openProject(el.dataset.pid); break;
    case 'close-project': closeProject(); break;
    case 'goto-control':  setView('control'); break;
    case 'focus-search': {
      setView('control');
      setTimeout(() => { const i = document.getElementById('searchInput'); if(i && i.focus) i.focus(); }, 40);
      break;
    }
    case 'set-preset':    setPreset(el.dataset.preset); break;
    case 'pane-kind':     setPaneKind(slot, el.dataset.kind); break;
    case 'clear-pane':    clearPane(slot); break;
    case 'reset-panes':   resetPanes(); break;
    case 'todo-toggle':   todoToggle(slot, +el.dataset.idx); break;
    case 'todo-del':      todoDel(slot, +el.dataset.idx); break;
    case 'todo-add': {
      const inp = document.querySelector('[data-field="todo-new"][data-slot="' + slot + '"]');
      if(inp){ todoAdd(slot, inp.value); }
      break;
    }
    case 'copy-path':     copyText((projectById(el.dataset.pid) || {}).path || ''); break;
    case 'copy-text':     copyText(el.dataset.text || ''); break;
    case 'open-url': {
      const pane = panesOfProject(activeId)[slot];
      openUrl(pane.content || '');
      break;
    }
    case 'reload-frame': {
      const f = document.querySelector('[data-frame="' + slot + '"]');
      const fb = document.querySelector('[data-fallback="' + slot + '"]');
      if(fb) fb.style.display = 'flex';
      if(f){ const pane = panesOfProject(activeId)[slot]; f.src = pane.content || ''; }
      toast('已重载内嵌页面');
      break;
    }
    case 'hide-fallback': {
      const key = el.dataset.fallback !== undefined ? el.dataset.fallback : String(slot);
      const fb = document.querySelector('[data-fallback="' + key + '"]');
      if(fb) fb.style.display = 'none';
      toast('已隐藏提示层 · 若空白说明服务未运行或禁止内嵌');
      break;
    }
    case 'repo-nav':      repoNav(slot === null ? (el.dataset.navrel !== undefined ? repoSlotOf(el) : 0) : slot, el.dataset.rel || ''); break;
    case 'repo-open':     repoOpen(slot, el.dataset.rel); break;
    case 'repo-close':    repoClose(slot); break;
    case 'connect-dir':   connectDir(el.dataset.pid); break;
    case 'live-nav': {
      const pid = el.dataset.pid, s = +el.dataset.slot;
      panesOfProject(pid)[s].content = el.dataset.rel;
      persistPanes();
      renderSplit();
      break;
    }
    case 'live-open':     liveOpen(el.dataset.pid, +el.dataset.slot, el.dataset.rel); break;
    case 'live-save':     liveSave(el.dataset.pid, el.dataset.rel, el); break;
    case 'srv-nav': {
      const s = +el.dataset.slot;
      panesOfProject(activeId)[s].content = el.dataset.rel || '';
      persistPanes();
      renderSplit();
      break;
    }
    case 'srv-open': {
      const s = +el.dataset.slot;
      const rel = el.dataset.rel || '';
      const parts = rel.split('/');
      const name = parts.pop();
      srvOpen(activeId, s, parts.join('/'), name);
      break;
    }
    case 'srv-save':      srvSave(+el.dataset.slot, el.dataset.rel, el); break;
    case 'srv-close': {
      const s = +el.dataset.slot;
      delete repoView[repoKey(activeId, panesOfProject(activeId)[s].content || '')];
      const host = document.querySelector('[data-srv-file="' + s + '"]');
      if(host) host.innerHTML = '';
      break;
    }
    case 'proj-open':     openProject(el.dataset.pid); break;
    case 'proj-add':      addFromScan(el.dataset.path, el.dataset.name, el.dataset.langs, el.dataset.size, el.dataset.files, el.dataset.updated, el.dataset.git); break;
    case 'proj-group':    projGroup = el.dataset.group; renderProjPane(+el.dataset.slot); break;
    case 'proj-filter':   projFilter = el.dataset.filter; renderProjPane(+el.dataset.slot); break;
    case 'scan-refresh':  scanRefresh(+el.dataset.slot); break;
    case 'chat-reload':   chatReload(+el.dataset.slot); break;
    case 'chat-open': {
      const pane = panesOfProject(activeId)[+el.dataset.slot];
      openUrl((pane && pane.content) || '');
      break;
    }
    case 'copy-context':  copyContext(el.dataset.pid); break;
    case 'mode-help':
      if(SERVER) toast('本地服务已接管文件读写 · 仓库窗格无需点选目录', 'ok');
      else toast('快照模式只读：双击「启动工作台.bat」起本地服务后即可读写文件', 'warn');
      break;
    case 'filter-state':
      stateFilter = el.dataset.state;
      store.write(LS.filter, stateFilter);
      renderControl();
      toast(stateFilter === 'all' ? '已显示全部状态' : '筛选：' + STATES[stateFilter].label);
      break;
    case 'refresh':
      toast('视图已刷新 · 数据来自本地扫描快照 ' + DATA.snapshot, 'ok');
      renderAll();
      break;
    case 'add-project':   openModal(); break;
    case 'close-modal':   closeModal(); break;
    case 'confirm-add':   confirmAdd(); break;
    case 'remove-custom': {
      custom = custom.filter(x => x.id !== el.dataset.pid);
      store.write(LS.custom, custom);
      if(activeId === el.dataset.pid) closeProject();
      renderAll();
      toast('已移除自定义项目', 'warn');
      break;
    }
  }
});

function repoSlotOf(el){
  const pane = el.closest('.pane');
  return pane ? +pane.dataset.slot : 0;
}

/* 卡片悬停光斑 */
root.addEventListener('mousemove', e => {
  const card = e.target.closest('.card');
  if(!card) return;
  const r = card.getBoundingClientRect();
  card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  card.style.setProperty('--my', (e.clientY - r.top) + 'px');
});

/* 键盘可达 */
root.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('project-card')){
    e.preventDefault(); openProject(e.target.dataset.pid); return;
  }
  const inp = e.target.closest && e.target.closest('[data-field="todo-new"]');
  if(inp && e.key === 'Enter'){ e.preventDefault(); todoAdd(+inp.dataset.slot, inp.value); inp.value = ''; return; }
  if(e.key === 'Escape' && document.getElementById('scrim').classList.contains('show')) closeModal();
});

/* 输入：不整页重渲染，避免丢焦点 */
let saveTimer = null;
function schedulePersist(){ clearTimeout(saveTimer); saveTimer = setTimeout(persistPanes, 350); }

root.addEventListener('input', e => {
  const el = e.target.closest('[data-field]');
  if(!el || !activeId) return;
  const slot = +el.dataset.slot, field = el.dataset.field;
  const pane = panesOfProject(activeId)[slot];
  if(!pane) return;
  if(field === 'proj-q'){ projQuery = el.value; renderProjPane(slot); return; }
  if(field === 'pane-title') pane.title = el.value;
  else if(field === 'note'){
    pane.content = el.value;
    const c = document.querySelector('[data-count="' + slot + '"]');
    if(c) c.textContent = el.value.length + ' 字符';
  }
  else if(field === 'link-url'){ pane.content = el.value; }
  else if(field === 'web-url'){
    pane.content = el.value;
  }
  else if(field === 'chat-url'){ pane.content = el.value; }
  schedulePersist();
});

root.addEventListener('change', e => {
  const sel = e.target.closest('[data-act="chat-preset"]');
  if(sel && sel.tagName === 'SELECT' && activeId){
    const slot = +sel.dataset.slot;
    const pane = panesOfProject(activeId)[slot];
    if(pane && pane.kind === 'chat'){
      pane.content = sel.value;
      persistPanes();
      const inp = document.querySelector('[data-field="chat-url"][data-slot="' + slot + '"]');
      if(inp) inp.value = sel.value;
      chatReload(slot);
    }
    return;
  }
  const el = e.target.closest('[data-act="todo-toggle"]');
  if(el && el.tagName === 'INPUT') todoToggle(+el.dataset.slot, +el.dataset.idx);
});

document.getElementById('searchInput').addEventListener('input', e => {
  query = e.target.value.trim();
  renderControl();
});

/* ============================================================
   添加项目弹窗
   ============================================================ */
const scrim = document.getElementById('scrim');
function openModal(){ scrim.classList.add('show'); document.getElementById('fName').focus(); }
function closeModal(){ scrim.classList.remove('show'); }
scrim.addEventListener('click', e => { if(e.target === scrim) closeModal(); });
['fName','fPath','fLangs'].forEach(k => {
  document.getElementById(k).addEventListener('keydown', e => { if(e.key === 'Enter') confirmAdd(); });
});
function confirmAdd(){
  const name = document.getElementById('fName').value.trim();
  const path = document.getElementById('fPath').value.trim();
  const langs = document.getElementById('fLangs').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  if(!name){ toast('请填写项目名称', 'warn'); return; }
  const id = 'custom-' + Date.now();
  custom.push({
    id, name, alias:name, path: path || '（未填写路径）',
    langs: langs.length ? langs : ['Other'], category:'自定义',
    sizeMB:0, git:false, updated: new Date().toISOString().slice(0,10), files:0, custom:true
  });
  store.write(LS.custom, custom);
  ['fName','fPath','fLangs'].forEach(k => { document.getElementById(k).value = ''; });
  closeModal();
  toast('已添加项目 ' + name, 'ok');
  renderAll();
}

/* ============================================================
   启动
   ============================================================ */
buildIndex();
if(activeId && !projectById(activeId)) activeId = null;
if(activeId && !presetOf[activeId]) presetOf[activeId] = 'l13';
renderAll();
if(view === 'workbench' && activeId) toast('已恢复上次的工作台：' + (projectById(activeId) || {}).alias);
detectServer();
</script>
</body>
</html>
