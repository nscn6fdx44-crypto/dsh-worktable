<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>工作台 · 控制室</title>
<style>
  :root{
    /* 冷调深色玻璃底（对齐 dsh-worktable 的 --wt-* 体系） */
    --bg:#0a0d13;
    --card:rgba(18,23,32,.34);
    --panel:rgba(255,255,255,.032);
    --panel-2:rgba(255,255,255,.055);
    --line:rgba(255,255,255,.075);
    --line-strong:rgba(255,255,255,.16);
    --border:#2a3140;
    --border-hover:#39445a;
    --txt:#e6e8eb;
    --txt-dim:#9aa4b2;
    --txt-mute:#6e7683;
    /* 强调色：克制的琥珀金（不使用紫蓝渐变） */
    --amber:#f0b429;
    --amber-2:#c98f1c;
    --amber-soft:rgba(240,180,41,.12);
    --amber-line:rgba(240,180,41,.30);
    --st-idle:#6e7683;
    --st-working:#f0b429;
    --st-needs:#e8734a;
    --st-done:#3fb950;
    --grid-line:rgba(255,255,255,.045);
    --mono:ui-monospace,"JetBrains Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --r:16px;
    --ease:cubic-bezier(.22,.7,.3,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--sans);color:var(--txt);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background:var(--bg);
  }
  /* 控制室背景层：30px 蓝图网格 + 四团缓慢漂移的暖色光斑（对齐 dsh-worktable 的 consoleBg） */
  .wt-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg)}
  .wt-bg::after{
    content:"";position:absolute;inset:0;
    background-image:
      linear-gradient(var(--grid-line) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
    background-size:30px 30px;
    -webkit-mask-image:radial-gradient(1300px 820px at 48% 0%,#000 0%,transparent 78%);
    mask-image:radial-gradient(1300px 820px at 48% 0%,#000 0%,transparent 78%);
  }
  /* 光斑：56vmax 模糊圆 + screen 叠加，克制地只走暖色，不用紫蓝 */
  .wt-blob{position:absolute;width:56vmax;height:56vmax;border-radius:50%;filter:blur(64px);mix-blend-mode:screen;will-change:transform}
  .wt-b1{background:radial-gradient(circle,#f0b429,transparent 66%);top:-18%;left:-14%;opacity:.34;animation:wtBlob1 13s ease-in-out infinite alternate}
  .wt-b2{background:radial-gradient(circle,#e8734a,transparent 66%);top:2%;right:-20%;opacity:.26;animation:wtBlob2 17s ease-in-out infinite alternate}
  .wt-b3{background:radial-gradient(circle,#2fd4b0,transparent 66%);bottom:-22%;left:12%;opacity:.20;animation:wtBlob3 11s ease-in-out infinite alternate}
  .wt-b4{background:radial-gradient(circle,#c98f1c,transparent 66%);bottom:-10%;right:2%;opacity:.28;animation:wtBlob4 15s ease-in-out infinite alternate}
  @keyframes wtBlob1{from{transform:translate(0,0) scale(1)}to{transform:translate(12vw,8vh) scale(1.12)}}
  @keyframes wtBlob2{from{transform:translate(0,0) scale(1)}to{transform:translate(-11vw,9vh) scale(1.10)}}
  @keyframes wtBlob3{from{transform:translate(0,0) scale(1)}to{transform:translate(10vw,-7vh) scale(1.14)}}
  @keyframes wtBlob4{from{transform:translate(0,0) scale(1)}to{transform:translate(-9vw,-8vh) scale(1.11)}}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:8px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(240,180,41,.30);background-clip:content-box}
  button,input,textarea,select{font-family:inherit}
  .mono{font-family:var(--mono)}

  /* ================= shell ================= */
  .app{position:relative;z-index:1;display:flex;min-height:100vh}

  /* ================= sidebar ================= */
  .sidebar{
    width:274px;flex:none;display:flex;flex-direction:column;
    padding:18px 12px 14px;gap:12px;
    height:100vh;position:sticky;top:0;
    border-right:1px solid var(--line);
    background:linear-gradient(180deg,rgba(255,255,255,.026),rgba(255,255,255,.004));
  }
  .brand{display:flex;align-items:center;gap:11px;padding:2px 6px 8px}
  .brand-mark{
    width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.16);font-size:17px;line-height:1
  }
  .brand-name{font-size:14.5px;font-weight:650;letter-spacing:.2px}
  .brand-sub{font-size:10.5px;color:var(--txt-mute);letter-spacing:.7px;text-transform:uppercase}
  .brand-tools{margin-left:auto;display:flex;align-items:center;gap:2px}
  .brand-tools button{
    width:24px;height:24px;padding:0;display:grid;place-items:center;border:1px solid transparent;border-radius:7px;
    background:transparent;color:var(--txt-mute);cursor:pointer;transition:.18s var(--ease)
  }
  .brand-tools button:hover{background:rgba(255,255,255,.07);border-color:var(--line-strong);color:var(--txt)}
  .brand-tools svg{width:14px;height:14px}

  .nav-label{
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-mute);
    padding:0 10px;margin:6px 0 5px;display:flex;align-items:center;justify-content:space-between
  }
  .nav-label span{font-family:var(--mono);letter-spacing:0;text-transform:none}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav-item{
    display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:11px;
    border:1px solid transparent;background:transparent;color:var(--txt-dim);font-size:13.5px;font-weight:520;
    cursor:pointer;text-align:left;transition:background .2s var(--ease),color .2s,border-color .2s,transform .2s var(--ease);
  }
  .nav-item:hover{background:rgba(255,255,255,.05);color:var(--txt)}
  .nav-item:active{transform:scale(.985)}
  .nav-item.active{background:rgba(240,180,41,.10);border-color:rgba(240,180,41,.26);color:#f5d68f}
  .nav-item .ni-ico{width:17px;height:17px;flex:none;opacity:.85}
  .nav-item .ni-count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--txt-mute)}
  .nav-item.active .ni-count{color:rgba(240,180,41,.85)}

  /* 项目列表（左栏）：emoji + 名称 + 状态光 + 箭头，34px 行高 */
  .plist{flex:1;min-height:80px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;padding-right:2px}
  .pitem{
    display:flex;align-items:center;gap:10px;width:100%;height:36px;box-sizing:border-box;
    padding:0 10px;border-radius:9px;border:1px solid transparent;
    background:rgba(255,255,255,.02);cursor:pointer;text-align:left;font:inherit;
    transition:background .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease)
  }
  .pitem:hover{background:rgba(255,255,255,.055);border-color:var(--line-strong);transform:translateX(1px)}
  .pitem.active{background:rgba(240,180,41,.10);border-color:rgba(240,180,41,.30)}
  .pitem .pi-ico{flex:none;font-size:15px;line-height:1}
  .pitem .pi-name{
    flex:1;min-width:0;font-size:12.8px;font-weight:500;color:var(--txt-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .pitem.active .pi-name{color:#f5d68f;font-weight:600}
  .pitem .pi-arrow{flex:none;width:13px;height:13px;opacity:.3;transition:opacity .18s}
  .pitem:hover .pi-arrow{opacity:.72}

  /* 四态状态光 */
  .light{
    width:9px;height:9px;flex:none;border-radius:50%;border:0;padding:0;cursor:pointer;
    transition:transform .2s var(--ease),box-shadow .2s
  }
  .light:hover{transform:scale(1.35)}
  .light.idle{background:var(--st-idle);box-shadow:0 0 0 3px rgba(107,104,99,.16)}
  .light.working{background:var(--st-working);box-shadow:0 0 0 3px rgba(240,180,41,.20),0 0 10px rgba(240,180,41,.7);animation:lpulse 2.1s ease-in-out infinite}
  .light.needs-you{background:var(--st-needs);box-shadow:0 0 0 3px rgba(232,115,74,.20),0 0 10px rgba(232,115,74,.6);animation:lpulse 1.5s ease-in-out infinite}
  .light.done{background:var(--st-done);box-shadow:0 0 0 3px rgba(95,211,154,.20),0 0 10px rgba(95,211,154,.55)}
  @keyframes lpulse{0%,100%{opacity:1}50%{opacity:.42}}

  .sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:9px}
  /* 底部统计玻璃盒 */
  .foot-box{
    display:flex;flex-direction:column;gap:1px;padding:10px 12px;border-radius:13px;
    border:1px solid var(--line);
    background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.015));
    backdrop-filter:blur(8px) saturate(1.15);
    -webkit-backdrop-filter:blur(8px) saturate(1.15)
  }
  .fb-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;font-size:11.5px;color:var(--txt-mute)}
  .fb-row b{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--txt-dim);font-variant-numeric:tabular-nums}

  /* 控制室入口：呼吸灯 + 高亮边框 */
  .control-entry{
    position:relative;display:flex;align-items:center;gap:10px;width:100%;
    padding:11px 12px;border-radius:13px;cursor:pointer;overflow:hidden;
    border:1px solid rgba(240,180,41,.36);
    background:linear-gradient(135deg,rgba(240,180,41,.16),rgba(240,180,41,.03));
    color:#f6da9c;font-size:13.5px;font-weight:600;
    transition:transform .24s var(--ease),border-color .24s,background .24s;
    animation:breathe 3.1s ease-in-out infinite;
  }
  .control-entry:hover{transform:translateY(-2px);border-color:rgba(240,180,41,.62)}
  .control-entry:active{transform:translateY(0) scale(.985)}
  .control-entry.active{background:linear-gradient(135deg,rgba(240,180,41,.24),rgba(240,180,41,.06))}
  .control-entry .ce-ico{width:18px;height:18px;flex:none}
  .control-entry .ce-txt{display:flex;flex-direction:column;line-height:1.25}
  .control-entry .ce-txt small{font-size:10.5px;font-weight:500;color:rgba(246,218,156,.62);letter-spacing:.04em}
  .control-entry .ce-arrow{margin-left:auto;opacity:.55}
  .control-entry::after{
    content:"";position:absolute;inset:0;border-radius:13px;pointer-events:none;
    background:linear-gradient(105deg,transparent 30%,rgba(255,224,150,.14) 48%,transparent 66%);
    transform:translateX(-120%);animation:sheen 4.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{box-shadow:0 0 0 1px rgba(240,180,41,.12),0 0 0 rgba(240,180,41,0)}
    50%{box-shadow:0 0 0 1px rgba(240,180,41,.34),0 0 26px -2px rgba(240,180,41,.36)}
  }
  @keyframes sheen{0%{transform:translateX(-120%)}42%,100%{transform:translateX(130%)}}
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none;animation:pulse 2.3s ease-out infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(240,180,41,.55)}
    70%{box-shadow:0 0 0 9px rgba(240,180,41,0)}
    100%{box-shadow:0 0 0 0 rgba(240,180,41,0)}
  }

  /* ================= main ================= */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  /* 顶栏：悬浮玻璃 Dock */
  .topbar{
    position:sticky;top:12px;z-index:20;
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    margin:14px 24px 16px;padding:11px 16px;border-radius:15px;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.055);
    box-shadow:0 8px 24px rgba(0,0,0,.34);
    backdrop-filter:blur(14px) saturate(1.3);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);
  }
  .tb-title{display:flex;align-items:center;gap:10px;min-width:0}
  .tb-title h1{margin:0;font-size:19px;font-weight:680;letter-spacing:-.01em;white-space:nowrap}
  .eyebrow{
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);
    border:1px solid var(--amber-line);border-radius:99px;padding:2px 9px;background:var(--amber-soft);white-space:nowrap
  }
  .tb-sub{margin:4px 0 0;font-size:12px;color:var(--txt-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}

  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;
    border:1px solid var(--line-strong);background:var(--panel);color:var(--txt-dim);
    font-size:12.5px;font-weight:560;cursor:pointer;white-space:nowrap;
    transition:.2s var(--ease);
  }
  .btn:hover{background:var(--panel-2);color:var(--txt);border-color:rgba(255,255,255,.22);transform:translateY(-1px)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn.primary{border-color:var(--amber-line);color:#f7dd9f;background:linear-gradient(135deg,rgba(240,180,41,.20),rgba(240,180,41,.05))}
  .btn.primary:hover{border-color:rgba(240,180,41,.55);box-shadow:0 6px 22px -10px rgba(240,180,41,.6)}
  .btn.small{padding:6px 10px;font-size:11.5px;border-radius:9px}
  .btn.ico{padding:7px;border-radius:9px}
  .btn.danger:hover{color:#f0a08a;border-color:rgba(232,115,74,.42)}
  .btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}

  .view{display:none;padding:0 24px 34px}
  .view.active{display:block;animation:fadeUp .34s var(--ease)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

  /* ================= stats ================= */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin:0 auto 16px;max-width:1064px}
  .stat{
    position:relative;overflow:hidden;padding:13px 15px 14px;border-radius:14px;
    border:1px solid transparent;
    background:
      linear-gradient(135deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.05) 34%,rgba(255,255,255,.012) 64%,rgba(0,0,0,.05) 100%),
      rgba(18,23,32,.30);
    box-shadow:0 8px 22px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter:blur(8px) saturate(1.15);
    -webkit-backdrop-filter:blur(8px) saturate(1.15);
    transition:border-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease)
  }
  .stat::after{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
    background:conic-gradient(from 45deg,rgba(0,0,0,.34) 0deg,rgba(255,255,255,.42) 90deg,rgba(0,0,0,.34) 180deg,rgba(255,255,255,.42) 270deg,rgba(0,0,0,.34) 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;
    pointer-events:none;opacity:.45
  }
  .stat:hover{transform:translateY(-3px);box-shadow:0 16px 36px -20px #000,0 0 26px -12px rgba(240,180,41,.5)}
  .stat:hover::after{background:conic-gradient(from 45deg,rgba(240,180,41,.2) 0deg,rgba(240,180,41,.8) 90deg,rgba(240,180,41,.2) 180deg,rgba(240,180,41,.8) 270deg,rgba(240,180,41,.2) 360deg)}
  .stat-k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-mute)}
  .stat-v{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
  .stat-v .unit{font-size:12.5px;color:var(--txt-mute);margin-left:3px;font-weight:500}
  .stat-note{margin-top:4px;font-size:11.5px;color:var(--txt-mute)}
  .stat-v.gold{color:var(--amber)}
  .stat-v.working{color:var(--st-working)}
  .stat-v.needs{color:var(--st-needs)}
  .stat-v.done{color:var(--st-done)}

  .section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:4px 0 12px}
  .section-head h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--txt-dim)}
  .section-head h2 span{color:var(--txt-mute);font-weight:500;font-family:var(--mono);font-size:11.5px;margin-left:8px}
  .hint{font-size:11.5px;color:var(--txt-mute)}

  /* ================= 卡片网格（对齐 dsh-worktable 控制室） ================= */
  /* 居中定宽轨道：246px 正方贴片，列数随视口收敛，控制室占 2×2 */
  .grid{
    --cols:4;--gap:64px;
    display:grid;grid-template-columns:repeat(var(--cols),minmax(0,246px));
    grid-auto-rows:auto;justify-content:center;align-items:start;gap:var(--gap);
    width:100%;margin:clamp(32px,9vh,110px) auto 0;
  }
  @media (max-width:1660px){.grid{--cols:3}}
  @media (max-width:1240px){.grid{--cols:2}}
  @media (max-width:780px){.grid{--cols:1}}

  .card{
    position:relative;box-sizing:border-box;display:flex;flex-direction:column;gap:13px;
    min-width:0;aspect-ratio:1;min-height:196px;padding:21px;
    border-radius:16px;border:1px solid transparent;overflow:hidden;cursor:pointer;
    /* 去磨砂（参考仓库第九/十轮定案）：不留 blur，30px 井字格才能透过来，读出「半透玻璃」 */
    background:
      linear-gradient(135deg,rgba(255,255,255,.20) 0%,rgba(255,255,255,.065) 30%,rgba(255,255,255,.012) 60%,rgba(0,0,0,.07) 100%),
      rgba(18,23,32,.24);
    box-shadow:0 10px 28px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.13);
    transition:transform .16s var(--ease),box-shadow .16s var(--ease);
  }
  /* 玻璃边缘：锥形渐变 1px 环（左上/右下亮，右上/左下暗），遮罩挖空实现 */
  .card::after{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
    background:conic-gradient(from 45deg,rgba(0,0,0,.40) 0deg,rgba(255,255,255,.55) 90deg,rgba(0,0,0,.40) 180deg,rgba(255,255,255,.55) 270deg,rgba(0,0,0,.40) 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;
    pointer-events:none;opacity:.5
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.09)}
  .card:active{transform:translateY(0) scale(.995)}
  .card:focus-visible{outline:2px solid var(--amber-line);outline-offset:3px}

  /* 卡片内部：图标 + 名称 / 分隔线 / 状态行 / 内容预览 */
  .c-head{display:flex;align-items:center;gap:13px;min-width:0}
  .c-ico{flex:none;font-size:31px;line-height:1;font-family:var(--sans)}
  .c-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:20px;font-weight:700;line-height:28px;letter-spacing:-.01em;color:var(--txt)}
  .c-div{flex:none;height:1px;background:var(--line)}
  .c-srow{display:flex;align-items:baseline;justify-content:space-between;gap:9px;min-width:0}
  .c-status{flex:none;font-size:22px;font-weight:700;line-height:30px;color:var(--txt-dim)}
  .c-status.idle{color:var(--txt-mute)}
  .c-status.working{color:var(--amber)}
  .c-status.needs-you{color:var(--st-needs)}
  .c-status.done{color:var(--st-done)}
  .c-meta{flex:none;font-family:var(--mono);font-size:13px;font-weight:600;line-height:30px;color:var(--txt-mute);font-variant-numeric:tabular-nums;white-space:nowrap}
  /* 预览字号缩到 8.5px（参考仓库第六轮定案：给卡片留更多余地，同空间容纳更多内容） */
  .c-preview{
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
    font-size:8.5px;line-height:13px;color:var(--txt-mute);word-break:break-word
  }
  .c-preview.mute{font-style:italic;-webkit-line-clamp:2;font-size:9px}

  .card .light{margin-left:auto;flex:none}

  /* 状态光效：整卡霓虹描边光晕（完成=绿 / 待处理=橙） */
  .card.glow-done{border-color:rgba(63,185,80,.85);box-shadow:0 0 8px rgba(63,185,80,.45),0 0 26px rgba(63,185,80,.26),inset 0 0 16px rgba(63,185,80,.07)}
  .card.glow-needs{border-color:rgba(232,115,74,.9);box-shadow:0 0 8px rgba(232,115,74,.45),0 0 26px rgba(232,115,74,.26),inset 0 0 16px rgba(232,115,74,.08)}
  .card.glow-done::after,.card.glow-needs::after{opacity:0}

  /* 工作中：琥珀金彗星光环顺时针旋转 + 斜向扫光 */
  @property --wt-angle{syntax:"<angle>";initial-value:0deg;inherits:false}
  /* 环加厚到 3px 并贴卡边。参考仓库用的是 inset:-4px/padding:4px（外扩环），
     但那要求卡片不裁剪；本实现 .card 有 overflow:hidden，外扩部分会被裁掉，
     故改用 inset:0 的 3px 卡边环 —— 与参考截图呈现的「亮边 + 双层外发光」一致 */
  .card.busy{box-shadow:0 0 10px rgba(240,180,41,.55),0 0 34px rgba(240,180,41,.40)}
  .card.busy::before{
    content:"";position:absolute;inset:0;border-radius:16px;padding:3px;pointer-events:none;
    background:conic-gradient(from var(--wt-angle),
      transparent 0deg,rgba(240,180,41,0) 22deg,#fff6d8 54deg,#f0b429 86deg,rgba(240,180,41,0) 126deg,transparent 205deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;
    animation:wtAngleSpin 1.4s linear infinite;
    filter:drop-shadow(0 0 8px rgba(240,180,41,.9))
  }
  @keyframes wtAngleSpin{to{--wt-angle:360deg}}
  .card.busy::after{opacity:0}
  .wt-sweep{
    position:absolute;inset:-30%;border-radius:inherit;pointer-events:none;z-index:-1;
    background:linear-gradient(115deg,rgba(255,255,255,.01) 0%,rgba(255,255,255,.045) 30%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.045) 70%,rgba(255,255,255,.01) 100%);
    opacity:0;animation:wtSweep 3.2s ease-in-out infinite
  }
  @keyframes wtSweep{
    0%{opacity:0;transform:translate(-12%,-12%)}
    35%{opacity:1}55%{opacity:1}
    92%,100%{opacity:0;transform:translate(12%,12%)}
  }

  /* 控制室卡片：2×2 大正方形，琥珀金玻璃底 */
  .control-card{
    grid-column:span 2;grid-row:span 2;aspect-ratio:1;gap:16px;
    border-color:rgba(240,180,41,.26);
    background:
      radial-gradient(560px 260px at 6% -26%,rgba(240,180,41,.16),transparent 70%),
      linear-gradient(135deg,rgba(255,255,255,.20) 0%,rgba(255,255,255,.06) 30%,rgba(255,255,255,.012) 60%,rgba(0,0,0,.07) 100%),
      rgba(18,23,32,.24);
  }
  .control-card:hover{transform:translateY(-3px);border-color:rgba(240,180,41,.52);box-shadow:0 22px 50px -26px #000,0 0 46px -14px rgba(240,180,41,.5)}
  .control-card .c-ico{font-size:38px}
  .control-card .c-name{font-size:25px;line-height:34px}
  .control-card .c-status{font-size:25px;line-height:34px}
  .cc-badge{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#f6da9c;border:1px solid var(--amber-line);background:var(--amber-soft);padding:3px 10px;border-radius:99px;white-space:nowrap}
  .cc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:0;flex:1;align-content:center}
  .cc-cell{padding:14px 15px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.24)}
  .cc-cell .k{font-size:10.5px;letter-spacing:.06em;color:var(--txt-mute);white-space:nowrap}
  .cc-cell .v{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
  .cc-cell .v.gold{color:var(--amber)}
  .cc-cell .v.working{color:var(--st-working)}
  .cc-cell .v.needs{color:var(--st-needs)}
  .cc-cell .v.done{color:var(--st-done)}
  .control-card .c-preview{margin-top:2px}

  /* 新建卡片：玻璃底 + 虚线边，永远排在最后一位 */
  .add-card{
    justify-content:center;align-items:center;gap:10px;text-align:center;
    border:1.5px dashed var(--border-hover);
    background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.09),rgba(255,255,255,0) 65%),rgba(18,23,32,.34);
  }
  .add-card::after{display:none}
  .add-card:hover{border-color:rgba(240,180,41,.6);background:radial-gradient(circle at 50% 42%,rgba(240,180,41,.10),rgba(255,255,255,0) 65%),rgba(23,28,37,.45)}
  .add-plus{font-size:34px;line-height:1;font-weight:400;color:var(--txt-dim)}
  .add-card:hover .add-plus{color:var(--amber)}
  .add-label{font-size:13.5px;font-weight:600;color:var(--txt-dim)}
  .add-card:hover .add-label{color:var(--txt)}

  .empty{grid-column:1/-1;padding:52px 0;text-align:center;font-size:12.5px;color:var(--txt-mute)}

  /* 通用标签 / 容量条（控制室表格与本地检索共用） */
  .tag{font-family:var(--mono);font-size:10.5px;padding:2.5px 7px;border-radius:6px;color:var(--txt-dim);background:rgba(255,255,255,.045);border:1px solid var(--line);white-space:nowrap}
  .tag.gold{color:#e9c778;background:rgba(240,180,41,.08);border-color:rgba(240,180,41,.22)}
  .sizebar{height:3px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
  .sizebar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--amber-2),var(--amber));transition:width .6s var(--ease)}

  /* ================= 分栏工作台 ================= */
  .wb-bar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;
    padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel)
  }
  .wb-crumb{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
  .wb-crumb b{font-size:13.5px;font-weight:620;white-space:nowrap}
  .wb-crumb .p{font-family:var(--mono);font-size:10.5px;color:var(--txt-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:rgba(0,0,0,.22)}
  .seg button{
    padding:6px 11px;font-size:11.5px;font-weight:560;color:var(--txt-mute);background:transparent;border:0;cursor:pointer;
    border-right:1px solid var(--line);transition:.18s var(--ease);white-space:nowrap
  }
  .seg button:last-child{border-right:0}
  .seg button:hover{background:rgba(255,255,255,.05);color:var(--txt-dim)}
  .seg button.on{background:rgba(240,180,41,.14);color:#f7dd9f}
  .seg button .k{font-family:var(--mono);font-size:9.5px;opacity:.7;margin-left:4px}

  .pane-grid{display:grid;gap:12px;height:calc(100vh - 214px);min-height:460px}
  .pane-grid[data-preset="full"]{grid-template-columns:1fr}
  .pane-grid[data-preset="l2"]{grid-template-columns:1fr 1fr}
  .pane-grid[data-preset="g4"]{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .pane-grid[data-preset="l13"]{grid-template-columns:1fr 1fr;grid-template-rows:1.4fr 1fr}
  .pane-grid[data-preset="l13"] .pane[data-slot="0"]{grid-column:span 2}
  .pane-grid[data-preset="chat"]{grid-template-columns:1fr 1.25fr}
  @media (max-width:900px){
    .pane-grid{height:auto;min-height:0}
    .pane-grid[data-preset="l2"],.pane-grid[data-preset="g4"],.pane-grid[data-preset="l13"],.pane-grid[data-preset="chat"]{grid-template-columns:1fr;grid-template-rows:auto}
    .pane-grid[data-preset="l13"] .pane[data-slot="0"]{grid-column:span 1}
  }

  .pane{
    display:flex;flex-direction:column;min-height:0;min-width:0;
    border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
    transition:border-color .25s var(--ease),box-shadow .25s var(--ease)
  }
  .pane:hover{border-color:rgba(255,255,255,.16)}
  .pane.focus{border-color:var(--amber-line);box-shadow:0 0 0 1px rgba(240,180,41,.10),0 18px 40px -30px rgba(240,180,41,.5)}
  .pane-head{
    display:flex;align-items:center;gap:9px;padding:8px 10px;flex:none;
    border-bottom:1px solid var(--line);background:rgba(0,0,0,.20)
  }
  .pane-head .kind-chip{
    display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.06em;
    color:var(--txt-dim);border:1px solid var(--line);border-radius:7px;padding:2px 7px;background:rgba(255,255,255,.04);flex:none
  }
  .pane-head .kind-chip i{font-style:normal;color:var(--amber);font-size:11px}
  .pane-title{
    flex:1;min-width:40px;background:transparent;border:0;outline:0;color:var(--txt);
    font-size:12.5px;font-weight:600;padding:3px 5px;border-radius:6px;transition:background .2s
  }
  .pane-title:hover{background:rgba(255,255,255,.045)}
  .pane-title:focus{background:rgba(0,0,0,.35);box-shadow:0 0 0 2px rgba(240,180,41,.20)}
  .pane-tools{display:flex;align-items:center;gap:5px;flex:none}
  .mini-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    height:24px;min-width:24px;padding:0 7px;border-radius:7px;border:1px solid var(--line);
    background:rgba(255,255,255,.035);color:var(--txt-mute);font-size:11px;cursor:pointer;transition:.18s var(--ease)
  }
  .mini-btn:hover{color:var(--txt);border-color:var(--line-strong);background:rgba(255,255,255,.07)}
  .mini-btn:active{transform:scale(.94)}
  .pane-body{flex:1;min-height:0;overflow:auto;padding:11px 12px 13px}

  .empty-slot{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;height:100%;
    border:1px dashed rgba(255,255,255,.14);border-radius:12px;background:rgba(0,0,0,.14);padding:18px;text-align:center
  }
  .empty-slot p{margin:0;font-size:12px;color:var(--txt-mute)}
  .kind-picker{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
  .kind-picker button{
    display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;
    border:1px solid var(--line-strong);background:var(--panel);color:var(--txt-dim);font-size:11.5px;cursor:pointer;
    transition:.2s var(--ease)
  }
  .kind-picker button:hover{border-color:var(--amber-line);color:#f7dd9f;transform:translateY(-1px);background:rgba(240,180,41,.08)}
  .kind-picker button i{font-style:normal;color:var(--amber)}

  /* note */
  .note-area{
    width:100%;height:100%;min-height:150px;resize:none;border:0;outline:0;background:transparent;
    color:var(--txt);font-size:13px;line-height:1.72;font-family:var(--sans)
  }
  .note-area::placeholder{color:var(--txt-mute)}
  .pane-meta{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:var(--txt-mute);font-family:var(--mono);margin-top:6px}

  /* todo */
  .todo-list{display:flex;flex-direction:column;gap:2px}
  .todo-row{display:flex;align-items:flex-start;gap:9px;padding:6px 7px;border-radius:9px;transition:background .18s}
  .todo-row:hover{background:rgba(255,255,255,.045)}
  .todo-row input[type=checkbox]{
    appearance:none;width:15px;height:15px;flex:none;margin-top:2px;border-radius:4px;cursor:pointer;
    border:1px solid rgba(255,255,255,.24);background:rgba(0,0,0,.3);transition:.18s var(--ease);position:relative
  }
  .todo-row input[type=checkbox]:checked{background:rgba(95,211,154,.22);border-color:rgba(95,211,154,.55)}
  .todo-row input[type=checkbox]:checked::after{
    content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
    border:solid var(--st-done);border-width:0 2px 2px 0;transform:rotate(42deg)
  }
  .todo-row .tx{flex:1;font-size:12.8px;color:var(--txt-dim);word-break:break-word;cursor:pointer}
  .todo-row.done .tx{color:var(--txt-mute);text-decoration:line-through}
  .todo-row .del{opacity:0;transition:opacity .18s;flex:none}
  .todo-row:hover .del{opacity:1}
  .todo-add{display:flex;gap:7px;margin-top:9px}
  .todo-add input{
    flex:1;padding:7px 10px;border-radius:9px;border:1px solid var(--line-strong);
    background:rgba(0,0,0,.30);color:var(--txt);font-size:12.5px;outline:0;transition:.2s
  }
  .todo-add input:focus{border-color:var(--amber-line);box-shadow:0 0 0 3px rgba(240,180,41,.09)}
  .prog{height:4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin:11px 0 4px}
  .prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--amber-2),var(--st-done));transition:width .5s var(--ease)}

  /* link / web */
  .url-row{display:flex;gap:7px;margin-bottom:9px}
  .url-row input{
    flex:1;padding:7px 10px;border-radius:9px;border:1px solid var(--line-strong);
    background:rgba(0,0,0,.30);color:var(--txt);font-size:12px;font-family:var(--mono);outline:0;transition:.2s
  }
  .url-row input:focus{border-color:var(--amber-line);box-shadow:0 0 0 3px rgba(240,180,41,.09)}
  .link-card{
    display:flex;align-items:center;gap:11px;padding:13px;border-radius:12px;border:1px solid var(--line);
    background:rgba(0,0,0,.20)
  }
  .link-card .dom{font-family:var(--mono);font-size:12px;color:var(--txt-dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frame-wrap{position:relative;height:calc(100% - 44px);min-height:170px;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:rgba(0,0,0,.35)}
  .frame-wrap iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  .frame-fallback{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
    padding:18px;text-align:center;background:rgba(10,11,13,.92);color:var(--txt-mute);font-size:12px
  }
  .frame-fallback b{color:var(--txt-dim);font-size:12.5px}

  /* repo */
  .repo-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
  .crumb{display:flex;align-items:center;gap:3px;flex-wrap:wrap;flex:1;min-width:0}
  .crumb button{
    background:transparent;border:0;color:var(--txt-dim);font-size:11.5px;font-family:var(--mono);
    cursor:pointer;padding:3px 5px;border-radius:6px;transition:.18s
  }
  .crumb button:hover{background:rgba(240,180,41,.10);color:#f7dd9f}
  .crumb .sep{color:var(--txt-mute);font-size:11px}
  .tree{display:flex;flex-direction:column;gap:1px}
  .tree-row{
    display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;
    border:0;background:transparent;color:var(--txt-dim);font-size:12.5px;cursor:pointer;
    text-align:left;width:100%;transition:background .16s var(--ease)
  }
  .tree-row:hover{background:rgba(240,180,41,.07);color:var(--txt)}
  .tree-row.on{background:rgba(240,180,41,.13);color:#f7dd9f}
  .tree-row .ic{width:15px;flex:none;text-align:center;color:var(--amber);font-size:11px}
  .tree-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:12px}
  .tree-row .sz{font-family:var(--mono);font-size:10.5px;color:var(--txt-mute);flex:none}
  .file-view{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  .file-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .file-head .fp{font-family:var(--mono);font-size:11px;color:var(--txt-dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  pre.code{
    margin:0;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.42);
    font-family:var(--mono);font-size:11.5px;line-height:1.65;color:#cfcbc4;overflow:auto;max-height:340px;white-space:pre
  }
  .note-line{
    display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;font-size:11.5px;color:var(--txt-mute);
    border:1px solid var(--line);background:rgba(0,0,0,.18)
  }
  .note-line i{font-style:normal;color:var(--amber)}

  /* ================= 模式徽章 ================= */
  .mode-badge{
    display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:99px;
    font-size:11.5px;font-weight:560;cursor:pointer;user-select:none;white-space:nowrap;
    border:1px solid var(--line-strong);background:rgba(0,0,0,.24);color:var(--txt-mute);
    transition:.2s var(--ease)
  }
  .mode-badge i{font-style:normal;font-size:9px;line-height:1}
  .mode-badge:hover{border-color:var(--line-strong);color:var(--txt-dim)}
  .mode-badge.on{
    border-color:var(--amber-line);color:#f7dd9f;
    background:linear-gradient(135deg,rgba(240,180,41,.20),rgba(240,180,41,.05));
    box-shadow:0 0 24px -14px rgba(240,180,41,.95)
  }
  .mode-badge.on i{color:var(--amber);animation:pulse 2.3s ease-out infinite}
  .server-pill{
    display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-family:var(--mono);
    padding:3px 8px;border-radius:99px;border:1px solid rgba(95,211,154,.34);
    color:#9fe3bd;background:rgba(95,211,154,.09)
  }

  /* ================= 本地检索窗格 ================= */
  .pj-bar{display:flex;gap:7px;margin-bottom:8px}
  .pj-q{
    flex:1;min-width:0;padding:7px 10px;border-radius:9px;border:1px solid var(--line-strong);
    background:rgba(0,0,0,.30);color:var(--txt);font-size:12px;outline:0;transition:.2s
  }
  .pj-q:focus{border-color:var(--amber-line);box-shadow:0 0 0 3px rgba(240,180,41,.09)}
  .pj-seg{margin-bottom:8px}
  .pj-stat{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--txt-mute);
    font-family:var(--mono);padding:6px 9px;border-radius:9px;border:1px solid var(--line);
    background:rgba(0,0,0,.18);margin-bottom:9px
  }
  .pj-stat b{color:var(--txt-dim);font-weight:600}
  .pj-stat .sp{flex:1;min-width:8px}
  .pj-list{display:flex;flex-direction:column;gap:4px}
  .pj-group{
    display:flex;align-items:center;gap:7px;margin:9px 0 3px;
    font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-mute)
  }
  .pj-group span{font-family:var(--mono);color:var(--amber);font-size:10px;letter-spacing:0}
  .pj-row{
    display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;background:rgba(255,255,255,.022);transition:.18s var(--ease)
  }
  .pj-row:hover{border-color:var(--amber-line);background:rgba(240,180,41,.06);transform:translateX(2px)}
  .pj-row.run{border-color:rgba(95,211,154,.30)}
  .pj-row .light{flex:none}
  .pj-body{display:flex;flex-direction:column;min-width:0;flex:1}
  .pj-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pj-path{font-size:10px;color:var(--txt-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pj-tags{display:flex;gap:4px;flex:none}
  .pj-tags .tag{font-size:9.5px;padding:2px 6px}
  .pj-size{font-family:var(--mono);font-size:10.5px;color:var(--txt-mute);flex:none;min-width:54px;text-align:right}

  /* ================= AI 对话窗格 ================= */
  /* 对话窗格不再用「100% - 104px」按工具栏高度硬算：改成 flex 列，
     iframe 自动吃掉工具栏之外的全部高度，工具栏换行也不会把 iframe 挤没 */
  .pane-body.chat-body{display:flex;flex-direction:column;gap:7px;overflow:hidden;padding:10px 11px 12px}
  .chat-bar{flex-wrap:wrap;margin-bottom:0}
  .chat-bar select{
    flex:none;max-width:158px;padding:7px 9px;border-radius:9px;border:1px solid var(--line-strong);
    background:rgba(0,0,0,.30);color:var(--txt-dim);font-size:11.5px;outline:0;cursor:pointer;transition:.2s
  }

  /* ================= 控制室 ================= */

    display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:10px;

  .table-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.032),rgba(255,255,255,.008))}

  thead th{
    position:sticky;top:0;z-index:2;text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;

  tbody tr:hover{background:rgba(240,180,41,.045)}

    display:flex;align-items:center;gap:9px;flex:1;min-width:210px;max-width:400px;padding:8px 12px;

  }
  .search:focus-within{border-color:var(--amber-line);background:rgba(240,180,41,.05)}
  .search input{flex:1;background:transparent;border:0;outline:0;color:var(--txt);font-size:13px}

  /* ================= modal ================= */
  .scrim{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(6,7,9,.62);backdrop-filter:blur(5px)}
  .scrim.show{display:grid;animation:fade .22s var(--ease)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    width:min(440px,92vw);border-radius:16px;border:1px solid var(--line-strong);
    background:linear-gradient(180deg,#15161a,#101114);
    box-shadow:0 40px 90px -40px #000,0 0 0 1px rgba(240,180,41,.10);padding:20px;animation:pop .28s var(--ease)
  }
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  .modal h3{margin:0 0 3px;font-size:15px}
  .modal p{margin:0 0 16px;font-size:12px;color:var(--txt-mute)}
  .field{margin-bottom:12px}

  .field input{
    width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line-strong);
    background:rgba(0,0,0,.35);color:var(--txt);font-size:13px;outline:0;transition:.2s
  }
  .field input:focus{border-color:var(--amber-line);box-shadow:0 0 0 3px rgba(240,180,41,.10)}

  /* ================= toast ================= */
  .toasts{position:fixed;right:22px;bottom:22px;z-index:80;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
  .toast{
    display:flex;align-items:center;gap:10px;min-width:200px;max-width:360px;padding:11px 14px;border-radius:12px;
    border:1px solid var(--line-strong);border-left:3px solid var(--amber);

  }
  .toast.ok{border-left-color:var(--st-done)}

  .toast.out{animation:toastOut .3s var(--ease) forwards}
  @keyframes toastIn{from{opacity:0;transform:translateX(18px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateX(18px) scale(.96)}}

  @media (max-width:820px){

  @media (prefers-reduced-motion:reduce){

<script>
/* ============================================================
   快照数据（由本机扫描生成，非示例数据）
   ============================================================ */
/*__DATA__*/

/* ============================================================
   常量
   ============================================================ */
const KINDS = {
  note:        { label:'随手记',   icon:'✎', desc:'自由文本，自动保存' },
  todo:        { label:'待办清单', icon:'☑', desc:'勾选式任务列表' },
  link:        { label:'外链',     icon:'↗', desc:'一个可跳转的网址' },
  repo:        { label:'仓库',     icon:'▤', desc:'目录树 + 文件内容' },
  projects:    { label:'本地检索', icon:'⊞', desc:'检索本机项目并加入工作台' },
  chat:        { label:'AI 对话',  icon:'✦', desc:'窗格内嵌 AI 网页' },
  web:         { label:'网页',     icon:'◫', desc:'内嵌本地服务预览' },
  placeholder: { label:'预留位',   icon:'◇', desc:'空窗格' }
};
const KIND_ORDER = ['repo','projects','todo','note','link','web','chat','placeholder'];

const STATES = {
  'idle':      { label:'待命',   cls:'idle' },
  'working':   { label:'进行中', cls:'working' },
  'needs-you': { label:'待处理', cls:'needs-you' },
  'done':      { label:'已完成', cls:'done' }
};
const STATE_ORDER = ['idle','working','needs-you','done'];

const PRESETS = {
  full: { label:'单窗',     k:'1',  slots:1 },
  l2:   { label:'左右',     k:'2',  slots:2 },
  l13:  { label:'顶部大窗', k:'1+2',slots:3 },
  g4:   { label:'田字',     k:'2×2',slots:4 },
  chat: { label:'对话',     k:'1+AI',slots:2 }
};
const PRESET_ORDER = ['full','l2','l13','g4','chat'];
const MAX_SLOTS = 4;

/* AI 对话预设：优先用构建期注入 / 本地服务返回的列表 */
const FALLBACK_AI_PRESETS = [
  { name:'本机 Open WebUI', url:'http://localhost:3000' },
  { name:'本机 LobeChat',   url:'http://localhost:3210' },
  { name:'DeepSeek',        url:'https://chat.deepseek.com' }
];
let AI_PRESETS = (DATA && Array.isArray(DATA.aiPresets) && DATA.aiPresets.length)
  ? DATA.aiPresets.slice() : FALLBACK_AI_PRESETS.slice();

const LS = {
  view:'wt2.view', active:'wt2.active', status:'wt2.status', preset:'wt2.preset',
  panes:'wt2.panes', custom:'wt2.custom', filter:'wt2.filter'
};

/* ============================================================
   状态
   ============================================================ */
const store = {
  read(k, fb){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e){ return fb; } },
  write(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

let view        = store.read(LS.view, 'workbench');
let activeId    = store.read(LS.active, null);
let status      = store.read(LS.status, {});      // { pid: 'idle'|'working'|'needs-you'|'done' }
let presetOf    = store.read(LS.preset, {});      // { pid: 'l13' }
let panesOf     = store.read(LS.panes, {});       // { pid: [pane x4] }
let custom      = store.read(LS.custom, []);
let stateFilter = store.read(LS.filter, 'all');
let query       = '';
let repoView    = {};   // { 'pid|rel' : {file: path|null} }  —— 会话内，不持久化

const dirHandles = {};  // { pid: FileSystemDirectoryHandle } —— 会话内

let SERVER = false;     // 是否跑在本地服务下（可读写文件）；启动时探测 /api/health
let scanCache = null;   // { scannedAt, roots, projects } —— /api/scan 的结果，会话内
let projQuery = '';     // 本地检索窗格的搜索词（不持久化）
let projGroup = 'flat'; // 'flat' | 'lang' | 'cat'
let projFilter = 'all'; // 'all' | 'running' | 'new'

/* ============================================================
   工具
   ============================================================ */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function allProjects(){ return DATA.projects.concat(custom); }
function projectById(id){ return allProjects().find(p => p.id === id) || null; }
function initials(p){ const s = (p.alias || p.name || '?').replace(/[^\w\u4e00-\u9fa5]/g,''); return (s.slice(0,2) || 'PR').toUpperCase(); }
function shortPath(p, n){
  const full = p.path || '';
  if(full.length <= 44) return full;
  const parts = full.split('\\').filter(Boolean);
  if(parts.length < 3) return full;
  const isDrive = /^[A-Za-z]:$/.test(parts[0]);
  return (isDrive ? parts[0] + '\\' : '') + '…\\' + parts.slice(-(n || 2)).join('\\');
}
function fmtSize(mb){
  if(!mb) return '—';
  if(mb >= 1024) return (mb/1024).toFixed(2) + ' GB';
  if(mb < 1) return (mb*1024).toFixed(0) + ' KB';
  return mb.toFixed(1) + ' MB';
}
function fmtBytes(n){
  if(!n) return '0';
  if(n >= 1048576) return (n/1048576).toFixed(1) + ' MB';
  if(n >= 1024) return (n/1024).toFixed(1) + ' KB';
  return n + ' B';
}
function stOf(pid){ return status[pid] || 'idle'; }
function stLabel(pid){ return STATES[stOf(pid)].label; }

/* 项目图标：按分类优先，其次按主语言推断 */
const CAT_EMOJI = { '嵌入式':'🔌','上位机':'🖥️','练习':'📚','工具':'🛠️','扩展':'🧩','脚本':'📜','前端':'🌐','后端':'⚙️','数据':'📊','文档':'📄' };
function projEmoji(p){
  if(CAT_EMOJI[p.category]) return CAT_EMOJI[p.category];
  const l = (p.langs || [])[0] || '';
  if(/ESP|STM32|Arduino|C\+\+|^C$/i.test(l)) return '🔌';
  if(/Python/i.test(l)) return '🐍';
  if(/Node|JavaScript|TypeScript|Vue|React/i.test(l)) return '🌐';
  if(/PowerShell|Batch|Shell/i.test(l)) return '📜';
  if(/HTML|CSS/i.test(l)) return '🎨';
  return '📁';
}

/* 相对时间：以快照时刻为基准 */
function relTime(d){
  if(!d) return '';
  const a = Date.parse(String(d).slice(0,10) + 'T00:00:00');
  if(isNaN(a)) return String(d);
  const b = Date.parse(String(DATA.snapshot || '').slice(0,10) + 'T00:00:00');
  const base = isNaN(b) ? Date.now() : b;
  const days = Math.round((base - a) / 86400000);
  if(days <= 0) return '今天';
  if(days === 1) return '昨天';
  if(days < 30) return days + ' 天前';
  const mo = Math.floor(days / 30);
  return mo < 12 ? mo + ' 个月前' : Math.floor(mo / 12) + ' 年前';
}

/* 卡片预览：优先取 README 正文首段，退化到语言/规模摘要 */
function projPreview(p){
  const set = DATA.trees[p.id];
  const list = (set && set.samples) || [];
  const readme = list.find(s => /(^|\/)readme\.(md|markdown|txt|rst)$/i.test(s.p));
  const pick = readme || list.find(s => s.t && s.t.trim().length > 24) || list[0];
  if(pick && pick.t){
    const clean = cleanPreviewText(pick.t);
    if(clean.length > 24) return clean.slice(0, 220);
  }
  return '';
}

/* 预览清洗：先剥代码围栏与行内代码，再滤掉标记行，最后压缩空白（对齐参考仓库 cleanPreviewText） */
function cleanPreviewText(raw){
  return String(raw)
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/`[^`]*`/g, ' ')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .split(/\r?\n/)
    .filter(l => { const s = l.trim(); return s && !/^[|+\-=*_#>]/.test(s) && !/^https?:\/\//.test(s); })
    .join(' ')
    .replace(/[*_~]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function projSummary(p){
  return [(p.langs || []).slice(0,3).join(' · '), p.files ? p.files + ' 文件' : '',
          p.git ? 'git' : '', fmtSize(p.sizeMB)].filter(Boolean).join(' · ');
}

/* ============================================================
   目录树索引（把扁平快照转成嵌套结构）
   ============================================================ */
const TREE = {};
function buildIndex(){
  for(const pid in DATA.trees){
    const flat = DATA.trees[pid].tree || [];
    const root = { name:'', dirs:new Map(), files:new Map() };
    for(const node of flat){
      const p = node[0], isDir = node[1] === 1, size = node[2] || 0;
      const parts = p.split('/');
      const name = parts.pop();
      let cur = root;
      for(const seg of parts){
        if(!cur.dirs.has(seg)) cur.dirs.set(seg, { name:seg, dirs:new Map(), files:new Map() });
        cur = cur.dirs.get(seg);
      }
      if(isDir){ if(!cur.dirs.has(name)) cur.dirs.set(name, { name, dirs:new Map(), files:new Map() }); }
      else cur.files.set(name, { name, size });
    }
    TREE[pid] = root;
  }
}
function nodeAt(pid, rel){
  let cur = TREE[pid];
  if(!cur) return null;
  if(!rel) return cur;
  for(const seg of rel.split('/')){
    if(!cur.dirs.has(seg)) return null;
    cur = cur.dirs.get(seg);
  }
  return cur;
}
function listAt(pid, rel){
  const n = nodeAt(pid, rel);
  if(!n) return { dirs:[], files:[] };
  return {
    dirs: [...n.dirs.values()].sort((a,b) => a.name.localeCompare(b.name, 'zh')),
    files: [...n.files.values()].sort((a,b) => a.name.localeCompare(b.name, 'zh'))
  };
}
function sampleOf(pid, rel){
  const set = DATA.trees[pid];
  if(!set) return null;
  const hit = (set.samples || []).find(s => s.p === rel);
  return hit ? hit.t : null;
}

/* ============================================================
   本地检索（窗格 projects 的数据层）
   ============================================================ */
function normPath(s){ return String(s || '').replace(/[\\/]+$/, '').replace(/\\/g, '/').toLowerCase(); }

/** 已登记项目 + 扫描到但未登记的项目，合成一张统一列表 */
function projUniverse(){
  const rows = [], seen = new Set();
  allProjects().forEach(p => {
    seen.add(normPath(p.path));
    rows.push({
      pid:p.id, name:p.name, alias:p.alias || p.name, path:p.path, langs:p.langs || [],
      sizeBytes:(p.sizeMB || 0) * 1048576, files:p.files || 0, updated:p.updated || '',
      live:p.live || null, registered:true, category:p.category || '未分类'
    });
  });
  if(scanCache && Array.isArray(scanCache.projects)){
    scanCache.projects.forEach(sp => {
      if(seen.has(normPath(sp.path))) return;
      rows.push({
        pid:null, name:sp.name, alias:sp.name, path:sp.path, langs:sp.langs || [],
        sizeBytes:sp.sizeBytes || 0, files:sp.files || 0, updated:sp.updated || '',
        live:null, registered:false, category:'新发现', git:!!sp.git
      });
    });
  }
  return rows;
}

function projFiltered(){
  let rows = projUniverse();
  if(projFilter === 'running') rows = rows.filter(r => r.live);
  else if(projFilter === 'new') rows = rows.filter(r => !r.registered);
  const q = projQuery.trim().toLowerCase();
  if(q) rows = rows.filter(r => (r.alias + ' ' + r.name + ' ' + r.path + ' ' + (r.langs || []).join(' ')).toLowerCase().includes(q));
  return rows;
}

function projGrouped(rows){
  if(projGroup === 'flat') return [{ key:'', rows }];
  const keyOf = projGroup === 'lang'
    ? (r => (r.langs || [])[0] || '其他语言')
    : (r => r.category || '未分类');
  const map = new Map();
  rows.forEach(r => { const k = keyOf(r); if(!map.has(k)) map.set(k, []); map.get(k).push(r); });
  return [...map.entries()].map(([key, rs]) => ({ key, rows:rs }));
}

function projStatHTML(hit, total, running){
  return '<span>命中 <b>' + hit + '</b> / 共 ' + total + '</span>' +
    '<span>运行中 <b>' + running + '</b></span>' +

    (scanCache ? '<span>· 重扫于 ' + esc(String(scanCache.scannedAt || '').slice(11, 19)) + '</span>' : '');

function projRowHTML(r){
  const tags = (r.langs || []).slice(0, 2).map(l => '<span class="tag">' + esc(l) + '</span>').join('') +
    (r.live ? '<span class="tag gold">:' + r.live.port + '</span>' : '') +

  return '<div class="pj-row' + (r.live ? ' run' : '') + '"' +
      (r.registered ? ' data-act="proj-open" data-pid="' + esc(r.pid) + '" title="点开进入分栏工作台"' : '') + '>' +

      '<span class="pj-path" title="' + esc(r.path) + '">' + esc(shortPath(r, 2)) + '</span></span>' +

    (!r.registered ? '<button class="btn small primary" data-act="proj-add" data-path="' + esc(r.path) +
      '" data-name="' + esc(r.name) + '" data-langs="' + esc((r.langs || []).join(',')) +
      '" data-size="' + r.sizeBytes + '" data-files="' + r.files + '" data-updated="' + esc(r.updated) +
      '" data-git="' + (r.git ? '1' : '0') + '">加入</button>' : '') +

}

function projListHTML(){
  const rows = projFiltered();
  if(!rows.length) return '<div class="empty" style="padding:16px">没有匹配的项目</div>';
  return projGrouped(rows).map(g =>
    (g.key ? '<div class="pj-group">' + esc(g.key) + ' <span>' + g.rows.length + '</span></div>' : '') +
    g.rows.map(projRowHTML).join('')
  ).join('');
}

/** 只重画该窗格内的列表与统计，不整页重渲染（避免丢输入焦点） */
function renderProjPane(slot){
  const host = document.querySelector('[data-proj-list="' + slot + '"]');
  if(!host) return;
  host.innerHTML = projListHTML();
  const stat = document.querySelector('[data-proj-stat="' + slot + '"]');
  if(stat){
    const universe = projUniverse();
    stat.innerHTML = projStatHTML(projFiltered().length, universe.length, universe.filter(r => r.live).length);
  }
  const total = projUniverse();
  const newN = total.filter(r => !r.registered).length;
  const runN = total.filter(r => r.live).length;
  const counts = { all:total.length, running:runN, new:newN };
  Object.keys(counts).forEach(k => {
    const btn = document.querySelector('[data-act="proj-filter"][data-slot="' + slot + '"][data-filter="' + k + '"] .k');
    if(btn) btn.textContent = counts[k];
  });
}

/* URL 规范化：去引号空格并补协议。本机/内网地址默认 http，其余默认 https，
   这样输入 "localhost:3210" 这类裸地址不用再手写协议 */
function normalizeUrl(raw){
  let u = String(raw == null ? '' : raw).trim().replace(/^["'<]+|["'>]+$/g, '');
  if(!u) return '';
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)){
    const host = u.split('/')[0].split(':')[0].toLowerCase();
    const local = host === 'localhost' || host === '127.0.0.1' || host === '0.0.0.0'
      || /^192\.168\./.test(host) || /^10\./.test(host) || /\.local$/.test(host);
    u = (local ? 'http://' : 'https://') + u;
  }
  return u;
}

/* ---------- repo 窗格：服务模式（走 /api/tree 与 /api/file） ---------- */
async function srvJson(path){
  const res = await fetch(path, { cache:'no-store' });
  let data = null;
  try { data = await res.json(); } catch(e){ data = null; }
  if(!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data;
}

async function srvFill(pid){
  const hosts = document.querySelectorAll('[data-srv-tree]');
  if(!hosts.length) return;
  const panes = panesOfProject(pid);
  for(const host of hosts){
    const slot = +host.dataset.srvTree;
    const rel = (panes[slot] && panes[slot].content) || '';
    try {
      const j = await srvJson('/api/tree?project=' + encodeURIComponent(pid) + '&path=' + encodeURIComponent(rel));
      const rows = (j.dirs || []).map(d =>
          '<button class="tree-row" data-act="srv-nav" data-slot="' + slot + '" data-rel="' + esc(d.path) + '">' +
          '<span class="ic">▸</span><span class="nm">' + esc(d.name) + '/</span></button>').join('') +
        (j.files || []).map(f =>
          '<button class="tree-row" data-act="srv-open" data-slot="' + slot + '" data-rel="' + esc(f.path) + '">' +
          '<span class="ic">·</span><span class="nm">' + esc(f.name) + '</span><span class="sz">' + fmtBytes(f.size) + '</span></button>').join('');
      host.innerHTML = rows ||
        '<div class="empty" style="padding:14px">该目录为空' + (j.truncated ? '（已截断，仅显示前 400 项）' : '') + '</div>';
      const rv = repoView[repoKey(pid, rel)];
      if(rv && rv.file) srvOpen(pid, slot, rel, rv.file);
    } catch(e){
      host.innerHTML = '<div class="empty" style="padding:14px">读取失败：' + esc(e.message || e) + '</div>';
    }
  }
}

async function srvOpen(pid, slot, dir, name){
  const rel = dir ? dir + '/' + name : name;
  const host = document.querySelector('[data-srv-file="' + slot + '"]');
  if(!host) return;
  repoView[repoKey(pid, dir)] = { file:name };
  try {
    const j = await srvJson('/api/file?project=' + encodeURIComponent(pid) + '&path=' + encodeURIComponent(rel));
    if(j.binary){
      host.innerHTML = '<div class="file-head"><span class="fp">' + esc(rel) + ' · ' + fmtBytes(j.bytes) + '</span>' +
        '<button class="mini-btn" data-act="srv-close" data-slot="' + slot + '">关闭</button></div>' +
        '<div class="note-line"><i>◇</i>这是二进制文件，不在窗格内打开。用「复制路径」交给编辑器处理。</div>';
      toast('二进制文件，未在窗格内打开', 'warn');
      return;
    }
    host.innerHTML = '<div class="file-head"><span class="fp">' + esc(rel) + ' · ' + fmtBytes(j.bytes) +
        (j.truncated ? '（仅载入前 512KB）' : '') + '</span>' +
      (j.truncated ? '' : '<button class="btn small primary" data-act="srv-save" data-slot="' + slot + '" data-rel="' + esc(rel) + '">保存</button>') +
      '<button class="mini-btn" data-act="srv-close" data-slot="' + slot + '">关闭</button></div>' +
      '<textarea class="note-area" style="min-height:200px;font-family:var(--mono);font-size:11.5px" data-srv-text="' + slot + '">' + esc(j.content) + '</textarea>' +
      '<div class="pane-meta"><span>' + (j.truncated ? '文件过大，已禁用保存以免截断原文' : '直接写回磁盘 · 服务端已校验路径在项目根内') + '</span><span>' + j.content.length + ' 字符</span></div>';
    toast('已读取 ' + rel, 'ok');
  } catch(e){
    host.innerHTML = '<div class="file-view"><div class="note-line"><i>◇</i>读取失败：' + esc(e.message || e) + '</div></div>';
    toast('读取失败：' + (e.message || e), 'warn');
  }
}

async function srvSave(slot, rel, btn){
  const ta = document.querySelector('[data-srv-text="' + slot + '"]');
  if(!ta || !activeId) return;
  try {
    const res = await fetch('/api/file', {
      method:'POST',
      headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ project:activeId, path:rel, content:ta.value })
    });
    let data = null;
    try { data = await res.json(); } catch(e){ data = null; }
    if(!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
    toast('已写入磁盘：' + rel + ' · ' + fmtBytes(data.bytes), 'ok');
    if(btn) btn.textContent = '已保存';
  } catch(e){
    toast('写入失败：' + (e.message || e), 'warn');
  }
}
